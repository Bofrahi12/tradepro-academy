<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدرس | {{SEO_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container">
  <div id="denied" style="display:none;max-width:560px;margin:60px auto;text-align:center">
    <div class="form-card">
      <div style="font-size:3rem;margin-bottom:14px">🔒</div>
      <h2>هذا الدرس للمشتركين</h2>
      <p class="sub">احصل على الدورة للوصول إلى جميع الدروس والموارد.</p>
      <a href="index.html#pricing" class="btn btn-primary btn-lg btn-block">احصل على الدورة الآن</a>
    </div>
  </div>

  <div id="lesson-view" style="display:none" class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <div class="video-wrap" id="player"></div>
      <div class="lesson-head">
        <div><h2 id="lesson-title"></h2><div class="lesson-meta" id="lesson-meta"></div></div>
      </div>
      <p class="lesson-desc" id="lesson-desc"></p>
      <div class="lesson-nav">
        <a href="#" class="btn btn-ghost" id="prev-btn">→ الدرس السابق</a>
        <button class="btn btn-primary" id="complete-btn">✓ تم إكمال الدرس</button>
        <a href="#" class="btn btn-ghost" id="next-btn">الدرس التالي ←</a>
      </div>
      <div class="final-cta" id="guest-cta" style="display:none;margin-top:22px;padding:36px 24px">
        <h3 style="margin-bottom:10px">🎁 عجبك الدرس المجاني؟</h3>
        <p style="color:var(--muted);margin-bottom:20px">هذه مجرد البداية — احصل على الدورة الكاملة (10 Modules) بسعر الإطلاق.</p>
        <a href="index.html#pricing" class="btn btn-primary btn-lg">احصل على الدورة الآن</a>
      </div>
      <div class="notes-card">
        <h3>📝 ملاحظاتي</h3>
        <div class="field"><textarea id="notes" placeholder="دوّن ملاحظاتك حول هذا الدرس... (تُحفظ تلقائياً)"></textarea></div>
        <small style="color:var(--muted)" id="notes-status"></small>
      </div>
      <div class="resources-card" id="resources-wrap" style="display:none">
        <h3>📁 موارد الدرس</h3>
        <div id="resources"></div>
      </div>
    </main>
  </div>
</div>

<script>
(async function () {
  await App.renderHeader(); await App.applySettings();
  const id = new URLSearchParams(location.search).get('id') || location.pathname.split('/').pop().split('.')[0];
  let lesson;
  try { lesson = await Store.lesson(id); }
  catch (e) {
    if (e.status === 401 || e.code === 'login_required') { App.requireLoginRedirect(); return; }
    const d = document.getElementById('denied');
    d.style.display = 'block';
    if (e.code === 'lesson_locked') {
      d.querySelector('h2').textContent = 'هذا الدرس مقفل حالياً';
      d.querySelector('.sub').textContent = 'أكمل الدرس السابق أولاً لفتح هذا الدرس — التعلم بالترتيب يضمن استيعاباً أفضل.';
    }
    return;
  }
  document.getElementById('lesson-view').style.display = 'grid';
  document.title = lesson.title + ' | ' + document.title.replace(/^الدرس \| /, '');

  document.getElementById('player').innerHTML = App.videoEmbed(lesson.provider, lesson.video_url);
  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-meta').textContent =
    `${lesson.module ? lesson.module.title + ' · ' : ''}${lesson.duration ? '⏱ ' + lesson.duration + ' · ' : ''}${lesson.is_free_preview ? '🎁 معاينة مجانية' : ''}`;
  document.getElementById('lesson-desc').textContent = lesson.description || '';

  // viewer state: guests see free preview without tracking/notes
  let viewer = null;
  try { viewer = await Store.me(); } catch {}
  const canTrack = viewer && (viewer.enrolled || viewer.role === 'admin');
  if (!canTrack) document.getElementById('complete-btn').style.display = 'none';
  if (!viewer) document.querySelector('.notes-card').style.display = 'none';
  if (!canTrack) document.getElementById('guest-cta').style.display = 'block';

  // sidebar + prev/next
  const mods = await Store.curriculum();
  const prog = await Store.progress().catch(() => ({ completed: [] }));
  const done = new Set(prog.completed);
  const flat = mods.flatMap((m) => m.lessons.map((l) => ({ ...l })));
  const idx = flat.findIndex((l) => l.id === lesson.id);
  const unlocked = new Set();
  flat.forEach((l, i) => { if (i === 0 || done.has(flat[i - 1].id)) unlocked.add(l.id); });

  document.getElementById('sidebar').innerHTML = `<a href="student.html" class="lesson-link" style="margin-bottom:8px"><span class="st">⌂</span><span>لوحة الطالب</span></a>` +
    mods.map((m) => `<h4>${App.esc(m.title)}</h4>` + m.lessons.map((l) => {
      const isDone = done.has(l.id), isCur = l.id === lesson.id, isLocked = !unlocked.has(l.id) && !isCur;
      const cls = isDone ? 'done' : isCur ? 'current' : '';
      const icon = isDone ? '✓' : isLocked ? '🔒' : '▶';
      return `<a class="lesson-link ${cls}" href="${isLocked ? '#' : 'lesson.html?id=' + l.id}" ${isLocked ? 'onclick="return false" style="opacity:.45;cursor:not-allowed"' : ''}>
        <span class="st">${icon}</span><span>${App.esc(l.title)}</span></a>`;
    }).join('')).join('');

  const prev = flat[idx - 1], next = flat[idx + 1];
  const prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn');
  if (prev && unlocked.has(prev.id)) prevBtn.href = 'lesson.html?id=' + prev.id; else prevBtn.style.display = 'none';
  if (next && (done.has(lesson.id) || unlocked.has(next.id))) nextBtn.href = 'lesson.html?id=' + next.id; else nextBtn.style.display = 'none';

  // complete
  const completeBtn = document.getElementById('complete-btn');
  if (done.has(lesson.id)) { completeBtn.textContent = '✓ مكتمل'; completeBtn.disabled = true; completeBtn.style.opacity = '.6'; }
  completeBtn.onclick = async () => {
    try {
      await Store.completeLesson(lesson.id);
      completeBtn.textContent = '✓ مكتمل'; completeBtn.disabled = true; completeBtn.style.opacity = '.6';
      App.toast('أحسنت! تم تسجيل إكمال الدرس ✓');
      if (next) { nextBtn.href = 'lesson.html?id=' + next.id; nextBtn.style.display = ''; }
      setTimeout(() => { if (next) location.href = 'lesson.html?id=' + next.id; }, 1200);
    } catch (e) { App.toast('حدث خطأ، حاول مجدداً'); }
  };

  // notes (autosave)
  const notesEl = document.getElementById('notes'), notesStatus = document.getElementById('notes-status');
  try { notesEl.value = (await Store.getNote(lesson.id)).content || ''; } catch {}
  let nt;
  notesEl.addEventListener('input', () => {
    notesStatus.textContent = 'جارٍ الحفظ...';
    clearTimeout(nt);
    nt = setTimeout(async () => {
      try { await Store.setNote(lesson.id, notesEl.value); notesStatus.textContent = '✓ محفوظ'; }
      catch { notesStatus.textContent = 'تعذر الحفظ'; }
    }, 800);
  });

  // resources
  if (lesson.resources && lesson.resources.length) {
    document.getElementById('resources-wrap').style.display = 'block';
    const icons = { pdf: '📄', checklist: '✅', excel: '📊', csv: '📊', other: '📎' };
    document.getElementById('resources').innerHTML = lesson.resources.map((r) => `
      <div class="res-item"><span>${icons[r.file_type] || '📎'} ${App.esc(r.title)}</span>
      <a class="btn btn-ghost btn-sm" href="${App.esc(r.file_url)}" download>تحميل</a></div>`).join('');
  }
})();
</script>
</body>
</html>

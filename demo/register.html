<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | {{SEO_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container"><div class="auth-wrap"><div class="form-card">
  <h2>أنشئ حسابك</h2>
  <p class="sub">خطوة واحدة تفصلك عن بدء رحلة التعلم</p>
  <div class="form-err" id="err"></div>
  <form id="f">
    <div class="field"><label>الاسم الكامل</label><input type="text" id="name" required></div>
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required dir="ltr" style="text-align:left"></div>
    <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input type="password" id="password" required minlength="6"></div>
    <button class="btn btn-primary btn-block" type="submit">إنشاء الحساب</button>
  </form>
  <div class="form-link">لديك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a></div>
</div></div></div>
<script>
(async function () {
  await App.renderHeader(); await App.applySettings();
  const params = new URLSearchParams(location.search);
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('err'); err.style.display = 'none';
    try {
      let u = await Store.register(
        document.getElementById('name').value.trim(),
        document.getElementById('email').value.trim(),
        document.getElementById('password').value);
      if (params.get('enroll') === '1' && Store.demo) { await Store.enrollSelf(); u = await Store.me(); }
      location.href = App.resolve(params.get('next')) || (u.enrolled ? '/student' : '/#pricing');
    } catch (er) {
      err.textContent = er.code === 'email_exists' ? 'هذا البريد مسجل بالفعل. سجّل الدخول.' : (er.code === 'invalid_email' ? 'بريد إلكتروني غير صالح.' : 'حدث خطأ، حاول مجدداً.');
      err.style.display = 'block';
    }
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | {{SEO_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container"><div class="auth-wrap"><div class="form-card">
  <h2>تسجيل الدخول</h2>
  <p class="sub">مرحباً بعودتك إلى <span data-s="COURSE_NAME">TradePro Academy</span></p>
  <div class="form-err" id="err"></div>
  <form id="f">
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required dir="ltr" style="text-align:left"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="password" required></div>
    <button class="btn btn-primary btn-block" type="submit">دخول</button>
  </form>
  <div class="form-link"><a href="forgot.html">نسيت كلمة المرور؟</a></div>
  <div class="form-link">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a></div>
</div></div></div>
<script>
(async function () {
  await App.renderHeader(); await App.applySettings();
  const params = new URLSearchParams(location.search);
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('err'); err.style.display = 'none';
    try {
      let u = await Store.login(document.getElementById('email').value.trim(), document.getElementById('password').value);
      if (params.get('enroll') === '1' && Store.demo) { await Store.enrollSelf(); u = await Store.me(); }
      location.href = App.resolve(params.get('next')) || (u.role === 'admin' ? '/admin' : '/student');
    } catch (er) {
      err.textContent = er.code === 'invalid_credentials' ? 'بيانات الدخول غير صحيحة.' : 'حدث خطأ، حاول مجدداً.';
      err.style.display = 'block';
    }
  };
})();
</script>
</body>
</html>

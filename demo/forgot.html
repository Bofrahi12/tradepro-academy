<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور | {{SEO_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container"><div class="auth-wrap"><div class="form-card">
  <h2>نسيت كلمة المرور؟</h2>
  <p class="sub">أدخل بريدك الإلكتروني وسنرسل لك رابط الاستعادة</p>
  <div class="form-ok" id="ok">إذا كان البريد مسجلاً لدينا، ستصلك رسالة الاستعادة قريباً.</div>
  <form id="f">
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required dir="ltr" style="text-align:left"></div>
    <button class="btn btn-primary btn-block" type="submit">إرسال رابط الاستعادة</button>
  </form>
  <div class="form-link"><a href="login.html">العودة لتسجيل الدخول</a></div>
</div></div></div>
<script>
(async function () {
  await App.renderHeader(); await App.applySettings();
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    await Store.forgot(document.getElementById('email').value.trim());
    document.getElementById('ok').style.display = 'block';
    document.getElementById('f').style.display = 'none';
  };
})();
</script>
</body>
</html>

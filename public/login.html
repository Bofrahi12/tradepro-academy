<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | {{SEO_TITLE}}</title>
<link rel="canonical" href="{{CANONICAL_URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script><script src="/js/store.js"></script><script src="/js/app.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container"><div class="auth-wrap"><div class="form-card">
  <h2>تسجيل الدخول</h2>
  <p class="sub">مرحباً بعودتك إلى <span data-s="COURSE_NAME">TradePro Academy</span></p>
  <div class="form-err" id="err"></div>
  <form id="f">
    <div class="field"><label for="email">البريد الإلكتروني</label><input type="email" id="email" required dir="ltr" style="text-align:left" autocomplete="email"></div>
    <div class="field"><label for="password">كلمة المرور</label><div class="pass-wrap"><input type="password" id="password" required dir="ltr" style="text-align:left" autocomplete="current-password"><button type="button" class="pass-toggle" id="pass-toggle" aria-label="إظهار كلمة المرور">👁️</button></div></div>
    <button class="btn btn-primary btn-block" type="submit" id="submit-btn">دخول</button>
  </form>
  <div class="form-link"><a href="/forgot">نسيت كلمة المرور؟</a></div>
  <div class="form-link">ليس لديك حساب؟ <a href="/register">أنشئ حساباً جديداً</a></div>
</div></div></div>
<script>
(async function () {
  await App.renderHeader(); await App.applySettings();
  App.initPasswordToggle('password', 'pass-toggle');
  const params = new URLSearchParams(location.search);
  const form = document.getElementById('f');
  const btn = document.getElementById('submit-btn');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (btn.disabled) return;
    const err = document.getElementById('err'); err.style.display = 'none';
    App.btnLoading(btn, true, 'جارٍ تسجيل الدخول...');
    try {
      let u = await Store.login(document.getElementById('email').value.trim(), document.getElementById('password').value);
      if (params.get('enroll') === '1' && Store.demo) { await Store.enrollSelf(); u = await Store.me(); }
      location.href = params.get('next') || (u.role === 'admin' ? '/admin' : '/student');
    } catch (er) {
      App.btnLoading(btn, false);
      err.textContent = er.code === 'invalid_credentials' ? 'بيانات الدخول غير صحيحة.' : 'حدث خطأ، حاول مجدداً.';
      err.style.display = 'block';
      err.setAttribute('role', 'alert');
    }
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدرس | {{SEO_TITLE}}</title>
<link rel="canonical" href="{{CANONICAL_URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script><script src="/js/store.js"></script><script src="/js/app.js"></script>
<script src="/js/quizzes.js"></script>
<style>
.quiz-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin:20px 0}
.quiz-q{margin-bottom:16px;padding:12px;background:rgba(255,255,255,.02);border-radius:10px}
.quiz-q p{font-weight:700;margin-bottom:8px}
.quiz-q label{display:block;padding:8px 12px;margin:4px 0;border:1px solid var(--card-border);border-radius:8px;cursor:pointer;transition:all .2s}
.quiz-q label:hover{border-color:var(--gold)}
.quiz-q input{margin-left:8px}
.quiz-q.correct label.correct-answer{border-color:#00e5a0;background:rgba(0,229,160,.1)}
.viewer-watermark{position:absolute;z-index:5;pointer-events:none;color:rgba(255,255,255,.55);font-size:.8rem;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.85);white-space:nowrap}
.wm-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);z-index:4;pointer-events:none;color:rgba(255,255,255,.07);font-size:1.6rem;font-weight:900;white-space:nowrap}
.video-wrap.capture-blur video{filter:blur(24px)}
.quiz-q.wrong label.wrong-answer{border-color:#ff6b6b;background:rgba(255,107,107,.1)}
</style></head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container">
  <div id="denied" style="display:none;max-width:560px;margin:60px auto;text-align:center">
    <div class="form-card">
      <div style="font-size:3rem;margin-bottom:14px">🔒</div>
      <h2>هذا الدرس للمشتركين</h2>
      <p class="sub">احصل على الدورة للوصول إلى جميع الدروس والموارد.</p>
      <a href="/#pricing" class="btn btn-primary btn-lg btn-block">احصل على الدورة الآن</a>
    </div>
  </div>

  <div id="lesson-view" style="display:none" class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <nav class="breadcrumb" aria-label="مسار التنقل" id="breadcrumb" style="display:none"></nav>
      <div class="video-wrap" id="player"></div>
      <div class="lesson-head">
        <div><h2 id="lesson-title"></h2><div class="lesson-meta" id="lesson-meta"></div></div>
      </div>
      <p class="lesson-desc" id="lesson-desc"></p>
      <div class="lesson-nav">
        <a href="#" class="btn btn-ghost" id="prev-btn">→ الدرس السابق</a>
        <button class="btn btn-primary" id="complete-btn">✓ تم إكمال الدرس</button>
        <a href="#" class="btn btn-ghost" id="next-btn">الدرس التالي ←</a>
      </div>
      <div class="final-cta" id="guest-cta" style="display:none;margin-top:22px;padding:36px 24px">
        <h3 style="margin-bottom:10px">🎁 عجبك الدرس المجاني؟</h3>
        <p style="color:var(--muted);margin-bottom:20px">هذه مجرد البداية — احصل على الدورة الكاملة (6 دروس فيديو) بسعر الإطلاق.</p>
        <a href="/#pricing" class="btn btn-primary btn-lg">احصل على الدورة الآن</a>
      </div>
      <div class="quiz-card" id="quiz-wrap" style="display:none">
        <h3>📝 اختبر نفسك</h3>
        <div id="quiz-questions"></div>
        <button class="btn btn-primary" id="quiz-submit" style="margin-top:12px">تحقق من الإجابات</button>
        <div id="quiz-result" style="margin-top:12px"></div>
      </div>
      <div class="notes-card">
        <h3>📝 ملاحظاتي</h3>
        <div class="field"><textarea id="notes" placeholder="دوّن ملاحظاتك حول هذا الدرس... (تُحفظ تلقائياً)"></textarea></div>
        <small style="color:var(--muted)" id="notes-status"></small>
      </div>
      <div class="resources-card" id="resources-wrap" style="display:none">
        <h3>📁 موارد الدرس</h3>
        <div id="resources"></div>
      </div>
    </main>
  </div>
</div>

<script>
(async function () {
  await App.renderHeader(); await App.applySettings();
  const id = location.pathname.split('/').pop();
  let lesson;
  try { lesson = await Store.lesson(id); }
  catch (e) {
    if (e.status === 401 || e.code === 'login_required') { App.requireLoginRedirect(); return; }
    const d = document.getElementById('denied');
    d.style.display = 'block';
    if (e.code === 'lesson_locked') {
      d.querySelector('h2').textContent = 'هذا الدرس مقفل حالياً';
      d.querySelector('.sub').textContent = 'أكمل الدرس السابق أولاً لفتح هذا الدرس — التعلم بالترتيب يضمن استيعاباً أفضل.';
    }
    return;
  }
  document.getElementById('lesson-view').style.display = 'grid';
  document.title = lesson.title + ' | ' + document.title.replace(/^الدرس \| /, '');

  document.getElementById('player').innerHTML = App.videoEmbed(
    lesson.provider, lesson.video_url,
    lesson.is_free_preview ? '/videos/lesson-1-poster.jpg' : null,
    lesson.id
  );
  // VdoCipher DRM lessons: fetch a one-time OTP (server checks enrollment)
  // and mount the DRM player. Screen capture/recordings come out black.
  if (lesson.provider === 'vdocipher') {
    (async () => {
      const slot = document.querySelector('[data-vdo-slot]');
      if (!slot) return;
      try {
        const r = await fetch(`/api/lesson/${lesson.id}/vdo-otp`, { credentials: 'same-origin', cache: 'no-store' });
        const d = await r.json().catch(() => null);
        if (!r.ok || !d || !d.otp) throw new Error('otp');
        const f = document.createElement('iframe');
        f.src = `https://player.vdocipher.com/v2/?otp=${encodeURIComponent(d.otp)}&playbackInfo=${encodeURIComponent(d.playbackInfo)}`;
        f.setAttribute('allow', 'encrypted-media; autoplay; fullscreen');
        f.setAttribute('allowfullscreen', '');
        f.setAttribute('title', 'فيديو الدرس');
        f.style.cssText = 'width:100%;height:100%;border:0;position:absolute;inset:0';
        slot.style.cssText = 'position:relative;width:100%;aspect-ratio:16/9;background:#000';
        slot.innerHTML = '';
        slot.appendChild(f);
      } catch (e) {
        slot.innerHTML = '<div class="video-empty"><div><div style="font-size:2.4rem;margin-bottom:10px">🔒</div><p>تعذر تشغيل الفيديو الآمن حالياً — حدّث الصفحة أو تواصل مع الدعم.</p></div></div>';
      }
    })();
  }
  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-meta').textContent =
    `${lesson.module ? lesson.module.title + ' · ' : ''}${lesson.duration ? '⏱ ' + lesson.duration + ' · ' : ''}${lesson.is_free_preview ? '🎁 معاينة مجانية' : ''}`;
  document.getElementById('lesson-desc').textContent = lesson.description || '';
  // breadcrumb: منصتي › Module › الدرس
  const bc = document.getElementById('breadcrumb');
  bc.style.display = 'block';
  bc.innerHTML = `<a href="/student">منصتي</a><span aria-hidden="true"> › </span>` +
    (lesson.module ? `<a href="/course">${App.esc(lesson.module.title)}</a><span aria-hidden="true"> › </span>` : '') +
    `<span aria-current="page">${App.esc(lesson.title)}</span>`;

  // viewer state: guests see free preview without tracking/notes
  let viewer = null;
  try { viewer = await Store.me(); } catch {}
  const canTrack = viewer && (viewer.enrolled || viewer.role === 'admin');
  if (!canTrack) document.getElementById('complete-btn').style.display = 'none';
  if (!viewer) document.querySelector('.notes-card').style.display = 'none';
  if (!canTrack) document.getElementById('guest-cta').style.display = 'block';

  // sidebar + prev/next
  const mods = await Store.curriculum();
  const prog = await Store.progress().catch(() => ({ completed: [] }));
  const done = new Set(prog.completed);
  const flat = mods.flatMap((m) => m.lessons.map((l) => ({ ...l })));
  const idx = flat.findIndex((l) => l.id === lesson.id);
  const unlocked = new Set();
  flat.forEach((l, i) => { if (i === 0 || done.has(flat[i - 1].id)) unlocked.add(l.id); });

  document.getElementById('sidebar').innerHTML = `<a href="/student" class="lesson-link" style="margin-bottom:8px"><span class="st">⌂</span><span>لوحة الطالب</span></a>` +
    mods.map((m) => `<h4>${App.esc(m.title)}</h4>` + m.lessons.map((l) => {
      const isDone = done.has(l.id), isCur = l.id === lesson.id, isLocked = !unlocked.has(l.id) && !isCur;
      const cls = isDone ? 'done' : isCur ? 'current' : '';
      const icon = isDone ? '✓' : isLocked ? '🔒' : '▶';
      return `<a class="lesson-link ${cls}" href="${isLocked ? '#' : '/lesson/' + l.id}" ${isLocked ? 'onclick="return false" style="opacity:.45;cursor:not-allowed"' : ''}>
        <span class="st">${icon}</span><span>${App.esc(l.title)}</span></a>`;
    }).join('')).join('');

  const prev = flat[idx - 1], next = flat[idx + 1];
  const prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn');
  if (prev && unlocked.has(prev.id)) prevBtn.href = '/lesson/' + prev.id; else prevBtn.style.display = 'none';
  if (next && (done.has(lesson.id) || unlocked.has(next.id))) nextBtn.href = '/lesson/' + next.id; else nextBtn.style.display = 'none';

  // complete
  const completeBtn = document.getElementById('complete-btn');
  if (done.has(lesson.id)) { completeBtn.textContent = '✓ مكتمل'; completeBtn.disabled = true; completeBtn.style.opacity = '.6'; }
  completeBtn.onclick = async () => {
    try {
      await Store.completeLesson(lesson.id);
      completeBtn.textContent = '✓ مكتمل'; completeBtn.disabled = true; completeBtn.style.opacity = '.6';
      App.toast('أحسنت! تم تسجيل إكمال الدرس ✓');
      if (next) { nextBtn.href = '/lesson/' + next.id; nextBtn.style.display = ''; }
      setTimeout(() => { if (next) location.href = '/lesson/' + next.id; }, 1200);
    } catch (e) { App.toast('حدث خطأ، حاول مجدداً'); }
  };

  // notes (autosave)
  const notesEl = document.getElementById('notes'), notesStatus = document.getElementById('notes-status');
  try { notesEl.value = (await Store.getNote(lesson.id)).content || ''; } catch {}
  let nt;
  notesEl.addEventListener('input', () => {
    notesStatus.textContent = 'جارٍ الحفظ...';
    clearTimeout(nt);
    nt = setTimeout(async () => {
      try { await Store.setNote(lesson.id, notesEl.value); notesStatus.textContent = '✓ محفوظ'; }
      catch { notesStatus.textContent = 'تعذر الحفظ'; }
    }, 800);
  });

  // resources
  if (Array.isArray(lesson.resources) && lesson.resources.length) {
    document.getElementById('resources-wrap').style.display = 'block';
    const icons = { pdf: '📄', checklist: '✅', excel: '📊', csv: '📊', other: '📎' };
    document.getElementById('resources').innerHTML = lesson.resources.map((r) => {
      const icon = icons[r.file_type] || '📎';
      const title = App.esc(r.title || 'Resource');
      const fileType = App.esc(r.file_type || 'file');
      const downloadButton = r.file_url
        ? `<a class="btn btn-ghost btn-sm" href="${App.esc(r.file_url)}" download target="_blank" rel="noopener noreferrer">تحميل</a>`
        : `<span style="color:var(--muted);font-size:.85rem">الرابط غير متوفر</span>`;
      return `<div class="res-item"><span>${icon} ${title} <small class="ft">${fileType}</small></span>${downloadButton}</div>`;
    }).join('');
  }
})();
</script>
<script>
(function(){
  function initQuiz(lessonId){
    var quiz = (window.LESSON_QUIZZES||{})[String(lessonId)];
    var wrap = document.getElementById('quiz-wrap');
    if(!quiz || !wrap) return;
    wrap.style.display = 'block';
    var qdiv = document.getElementById('quiz-questions');
    qdiv.innerHTML = quiz.map(function(item, qi){
      return '<div class="quiz-q" data-qi="'+qi+'"><p>'+(qi+1)+'. '+item.q+'</p>' +
        item.options.map(function(opt, oi){
          return '<label><input type="radio" name="q'+qi+'" value="'+oi+'"> '+opt+'</label>';
        }).join('') + '</div>';
    }).join('');
    document.getElementById('quiz-submit').onclick = function(){
      var correct = 0;
      quiz.forEach(function(item, qi){
        var qel = qdiv.querySelector('[data-qi="'+qi+'"]');
        var sel = qel.querySelector('input:checked');
        qel.classList.remove('correct','wrong');
        qel.querySelectorAll('label').forEach(function(l){l.classList.remove('correct-answer','wrong-answer');});
        if(sel){
          var labels = qel.querySelectorAll('label');
          labels[item.answer].classList.add('correct-answer');
          if(parseInt(sel.value)===item.answer){correct++;qel.classList.add('correct');}
          else{qel.classList.add('wrong');labels[parseInt(sel.value)].classList.add('wrong-answer');}
        }
      });
      var res = document.getElementById('quiz-result');
      if(correct===quiz.length){
        res.innerHTML = '<p style="color:#00e5a0;font-weight:700">🎉 ممتاز! أجبت صحيحاً على كل الأسئلة ('+correct+'/'+quiz.length+')</p>';
      } else {
        res.innerHTML = '<p style="color:#ffb020;font-weight:700">أجبت صحيحاً على '+correct+' من '+quiz.length+'. راجع الدرس وحاول مجدداً 💪</p>';
      }
    };
  }
  // Hook into lesson load - check every second for lesson id
  var check = setInterval(function(){
    var m = location.pathname.match(/(\d+)/);
    if(m){clearInterval(check);initQuiz(m[1]);}
  }, 500);
  setTimeout(function(){clearInterval(check);}, 10000);
})();
</script>

<script>
// ---- Content protection: identity watermark + capture deterrents (MP4 lessons) ----
(function () {
  var tries = 0;
  var timer = setInterval(async function () {
    tries++;
    var wrap = document.getElementById('player');
    var video = wrap ? wrap.querySelector('video') : null;
    if (!video) { if (tries > 40) clearInterval(timer); return; }
    clearInterval(timer);
    video.setAttribute('controlsList', 'nodownload');
    video.setAttribute('disablepictureinpicture', '');
    wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    var note = document.createElement('div');
    note.style.cssText = 'margin-top:10px;padding:10px 14px;border:1px solid rgba(245,197,24,.25);border-radius:10px;background:rgba(245,197,24,.05);color:var(--muted);font-size:.85rem';
    note.textContent = '🔒 فيديو محمي: المشاهدة شخصية لحسابك فقط، وتظهر على الفيديو علامة مائية بهويتك. تسجيل الشاشة أو التصوير أو مشاركة الحساب قد يؤدي إلى حظر الحساب.';
    wrap.parentNode.insertBefore(note, wrap.nextSibling);
    var viewer = null;
    try { viewer = await Store.me(); } catch (e) {}
    if (viewer && viewer.email) {
      var label = (viewer.name ? viewer.name + ' • ' : '') + viewer.email + ' • #' + viewer.id;
      var wm = document.createElement('div');
      wm.className = 'viewer-watermark'; wm.textContent = label; wrap.appendChild(wm);
      var center = document.createElement('div');
      center.className = 'wm-center'; center.textContent = viewer.email; wrap.appendChild(center);
      var spots = [
        { top: '8%', start: '4%' }, { top: '8%', end: '4%' },
        { bottom: '14%', start: '4%' }, { bottom: '14%', end: '4%' },
        { top: '42%', start: '30%' }
      ];
      var si = 0;
      function place() {
        var s = spots[si % spots.length]; si++;
        wm.style.top = s.top || 'auto'; wm.style.bottom = s.bottom || 'auto';
        wm.style.insetInlineStart = s.start || 'auto'; wm.style.insetInlineEnd = s.end || 'auto';
      }
      place(); setInterval(place, 7000);
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'PrintScreen' || (e.metaKey && e.shiftKey)) {
        wrap.classList.add('capture-blur');
        if (window.App && App.toast) App.toast('⚠️ التصوير والتسجيل ممنوعان — هذا المحتوى محمي ومرتبط بحسابك.');
        setTimeout(function () { wrap.classList.remove('capture-blur'); }, 2500);
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && !video.paused) video.pause();
    });
  }, 500);
})();
</script>
</body>
</html>

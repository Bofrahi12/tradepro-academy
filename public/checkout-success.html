<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تم تأكيد طلبك</title><link rel="stylesheet" href="/css/style.css"><script src="/js/config.js"></script><script src="/js/store.js"></script><script src="/js/app.js"></script></head>
<body><header class="site-header" id="site-header"></header><main class="container" style="min-height:70vh;display:grid;place-items:center;padding:50px 0"><section class="form-card" style="max-width:620px;text-align:center"><div id="status-icon" style="font-size:3.5rem">⏳</div><h1 id="status-title">جارٍ تأكيد الدفع...</h1><p class="sub" id="status-text">نحن نتحقق من العملية ونجهز وصولك للمحتوى.</p><div id="actions" style="display:none;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn btn-primary" href="/student">دخول إلى الدورة</a><a class="btn btn-ghost" href="/podcast">فتح Podcast</a></div></section></main><script>
(async function(){await App.renderHeader();const params=new URLSearchParams(location.search);const sid=params.get('session_id');const icon=document.getElementById('status-icon'),title=document.getElementById('status-title'),text=document.getElementById('status-text'),actions=document.getElementById('actions');if(!sid){icon.textContent='⚠️';title.textContent='الرابط غير مكتمل';text.textContent='ارجع إلى صفحة العرض أو تواصل معنا للمساعدة.';return}let done=false;for(let i=0;i<5&&!done;i++){try{const r=await fetch('/api/checkout/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})});const d=await r.json();if(r.ok&&d.ok){done=true;icon.textContent='✅';title.textContent='تم تأكيد طلبك';text.textContent='تم تفعيل وصولك. يمكنك البدء الآن.';actions.style.display='flex';break}if(d.error==='payment_not_confirmed'){await new Promise(x=>setTimeout(x,2000));continue}throw new Error('claim_failed')}catch{await new Promise(x=>setTimeout(x,1500))}}if(!done){icon.textContent='🕒';title.textContent='الدفع قيد المراجعة';text.textContent='توصلنا إلى صفحة الدفع، لكن التأكيد لم يصل بعد. انتظر قليلاً ثم أعد تحميل الصفحة.'}})();
</script></body></html>

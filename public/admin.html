<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | {{SEO_TITLE}}</title>
<link rel="canonical" href="{{CANONICAL_URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script><script src="/js/store.js"></script><script src="/js/app.js"></script>

<style>
.vid-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.vid-stat{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;min-width:100px}
.vid-stat .vid-num{font-size:1.6rem;font-weight:800}
.vid-stat.ok .vid-num{color:var(--green)}
.vid-stat.warn .vid-num{color:#ffb020}
.vid-alert{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.3);border-radius:12px;padding:12px 16px;margin-bottom:16px;color:#ffb020}
.vid-ok{background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.3);border-radius:12px;padding:12px 16px;margin-bottom:16px;color:var(--green)}
.vid-grid{display:grid;gap:20px}
.vid-module h4{margin-bottom:10px;color:var(--text)}
.vid-module{display:grid;gap:10px}
.vid-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px;align-items:center}
.vid-card.no-vid{border-color:rgba(255,176,32,.4)}
.vid-thumb{width:120px;height:68px;border-radius:8px;background:#0a1428;display:grid;place-items:center;position:relative;cursor:pointer;overflow:hidden;flex-shrink:0}
.vid-thumb img{width:100%;height:100%;object-fit:cover}
.vid-play{font-size:1.5rem;opacity:.8}
.vid-missing{font-size:1.5rem}
.vid-info{flex:1;display:grid;gap:6px}
.vid-title{font-weight:700}
.vid-meta{display:flex;gap:6px;flex-wrap:wrap}
/* --- king panel: bigger tap targets, owner highlights --- */
.admin-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.admin-tab{padding:12px 20px;font-size:1rem;white-space:nowrap;min-height:48px}
.icon-btn{min-height:40px;padding:8px 12px;font-size:.85rem}
.admin-table .btn-sm{min-height:38px;padding:8px 14px}
.stat-card.warn{border-color:rgba(255,176,32,.55);background:rgba(255,176,32,.07)}
.stat-card.warn b{color:#ffb020}
.pending-alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.4);border-radius:14px;padding:14px 18px;margin-bottom:18px;color:#ffcf6b}
.pill.owner{background:rgba(245,197,24,.14);color:var(--gold,#f5c518);border:1px solid rgba(245,197,24,.45)}
.row-self{opacity:.8}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container" style="padding-bottom:70px">
  <h1 style="margin-top:30px">لوحة الإدارة 🛠</h1>
  <p style="color:var(--muted)">إدارة المحتوى والطلاب وإعدادات الموقع — كل التعديلات تظهر فوراً على الموقع.</p>

  <div class="admin-tabs" id="tabs">
    <button class="admin-tab active" data-tab="overview">نظرة عامة</button>
    <button class="admin-tab" data-tab="orders">المدفوعات 💳</button>
    <button class="admin-tab" data-tab="content">المحتوى (Modules والدروس)</button>
      <button class="admin-tab" data-tab="videos">🎬 الفيديوهات</button>
    <button class="admin-tab" data-tab="site">نصوص الموقع</button>
    <button class="admin-tab" data-tab="students">الطلاب</button>
    <button class="admin-tab" data-tab="audit">سجل النشاط 📋</button>
    <button class="admin-tab" data-tab="settings">الإعدادات</button>
  </div>

  <div class="admin-panel active" id="panel-overview"></div>
  <div class="admin-panel" id="panel-orders"></div>
  <div class="admin-panel" id="panel-content"></div>
    <div class="admin-panel" id="panel-videos"></div>
  <div class="admin-panel" id="panel-site"></div>
  <div class="admin-panel" id="panel-students"></div>
  <div class="admin-panel" id="panel-audit"></div>
  <div class="admin-panel" id="panel-settings"></div>
</div>

<div class="modal-back" id="modal-back"><div class="modal">
  <h3 id="modal-title"></h3><div id="modal-fields"></div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="btn btn-primary" id="modal-save" style="flex:1">حفظ</button>
    <button class="btn btn-ghost" id="modal-cancel">إلغاء</button>
  </div>
</div></div>

<script>
const E = App.esc;
// ---------- generic modal ----------
let modalPrevFocus = null;
function openModal(title, fields, onSave) {
  modalPrevFocus = document.activeElement;
  document.getElementById('modal-title').textContent = title;
  const wrap = document.getElementById('modal-fields');
  wrap.innerHTML = fields.map((f, i) => {
    const v = f.value ?? '';
    let input;
    if (f.type === 'textarea') input = `<textarea id="mf-${i}" rows="4">${E(v)}</textarea>`;
    else if (f.type === 'select') input = `<select id="mf-${i}">${f.options.map((o) => `<option value="${o[0]}" ${String(v) === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
    else if (f.type === 'checkbox') input = `<input type="checkbox" id="mf-${i}" ${v ? 'checked' : ''} style="width:auto;transform:scale(1.4)">`;
    else if (f.type === 'videoupload') input = `<input type="file" id="mf-${i}" accept=".mp4,.webm,video/mp4,video/webm"><div id="mf-${i}-prog" style="display:none;margin-top:8px"><div style="height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden"><div id="mf-${i}-bar" style="height:100%;width:0%;background:#f5c518;transition:width .2s"></div></div><small id="mf-${i}-txt" style="color:var(--muted)"></small></div>`;
    else input = `<input type="${f.type || 'text'}" id="mf-${i}" value="${E(v)}" ${f.dir ? `dir="${f.dir}"` : ''}>`;
    return `<div class="field"><label>${f.label}${f.hint ? ` <small style="color:var(--muted)">${f.hint}</small>` : ''}</label>${input}</div>`;
  }).join('');
  fields.forEach((f, i) => {
    if (f.type !== 'videoupload') return;
    const fileInput = document.getElementById('mf-' + i);
    if (fileInput) fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (file) uploadAdminVideo(file, i, f);
    });
  });
  const back = document.getElementById('modal-back');
  back.classList.add('show');
  back.setAttribute('role', 'dialog');
  back.setAttribute('aria-modal', 'true');
  back.setAttribute('aria-label', title);
  document.getElementById('modal-save').onclick = async () => {
    const vals = fields.map((f, i) => {
      const el = document.getElementById('mf-' + i);
      if (f.type === 'videoupload') return '';
      if (f.type === 'checkbox') return el.checked ? 1 : 0;
      if (f.type === 'number') return parseInt(el.value || '0', 10);
      return el.value;
    });
    try { await onSave(vals); closeModal(); }
    catch (e) { App.toast('تعذر الحفظ', true); }
  };
  // focus first field; trap Tab inside modal; close on Escape
  const first = wrap.querySelector('input, select, textarea');
  if (first) first.focus();
}

// Upload a video file to the platform (persistent storage), then fill the
// lesson's video_url field + provider so saving the lesson attaches it.
function uploadAdminVideo(file, idx, field) {
  const prog = document.getElementById('mf-' + idx + '-prog');
  const bar = document.getElementById('mf-' + idx + '-bar');
  const txt = document.getElementById('mf-' + idx + '-txt');
  if (prog) prog.style.display = 'block';
  if (bar) bar.style.width = '0%';
  if (txt) txt.textContent = '⏳ جارٍ رفع: ' + file.name;
  const fd = new FormData();
  fd.append('video', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/admin/videos/upload');
  const m = document.cookie.match(/(?:^|;\s*)tpa_csrf=([^;]*)/);
  xhr.setRequestHeader('x-csrf-token', m ? decodeURIComponent(m[1]) : '');
  xhr.upload.onprogress = (ev) => {
    if (!ev.lengthComputable) return;
    const pct = Math.round((ev.loaded / ev.total) * 100);
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = '⏳ جارٍ الرفع… ' + pct + '%';
  };
  xhr.onload = () => {
    let data = {};
    try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) {}
    if (xhr.status >= 200 && xhr.status < 300 && data.path) {
      const urlInput = document.getElementById(field.targetId);
      if (urlInput) urlInput.value = data.path;
      const prov = document.getElementById(field.providerId);
      if (prov) prov.value = 'mp4';
      if (bar) bar.style.width = '100%';
      if (txt) txt.textContent = '✅ تم الرفع: ' + data.path + ' — اضغط «حفظ» لربطه بالدرس';
      App.toast('تم رفع الفيديو ✓');
    } else {
      if (txt) txt.textContent = '❌ فشل الرفع: ' + (data.error || xhr.status);
      App.toast('فشل رفع الفيديو', true);
    }
  };
  xhr.onerror = () => {
    if (txt) txt.textContent = '❌ فشل الرفع (خطأ في الاتصال)';
    App.toast('فشل رفع الفيديو', true);
  };
  xhr.send(fd);
}
function closeModal() {
  document.getElementById('modal-back').classList.remove('show');
  if (modalPrevFocus && modalPrevFocus.focus) modalPrevFocus.focus();
  modalPrevFocus = null;
}
document.addEventListener('keydown', (e) => {
  const back = document.getElementById('modal-back');
  if (!back || !back.classList.contains('show')) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Tab') {
    const focusables = back.querySelectorAll('input, select, textarea, button:not([style*="display: none"])');
    const list = [...focusables].filter((el) => el.offsetParent !== null);
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-back').addEventListener('click', (e) => { if (e.target.id === 'modal-back') closeModal(); });

const PROVIDERS = [['youtube', 'YouTube'], ['vimeo', 'Vimeo'], ['cloudflare', 'Cloudflare Stream'], ['mp4', 'رابط MP4 مباشر']];

// ---------- tabs ----------
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.admin-tab'); if (!b) return;
  document.querySelectorAll('.admin-tab').forEach((t) => t.classList.remove('active'));
  document.querySelectorAll('.admin-panel').forEach((p) => p.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('panel-' + b.dataset.tab).classList.add('active');
  loadTab(b.dataset.tab);
});

async function loadTab(t) {
  if (t === 'overview') return renderOverview();
  if (t === 'orders') return renderOrders();
  if (t === 'content') return renderContent();
  if (t === 'videos') return renderVideos();
  if (t === 'site') return renderSite();
  if (t === 'students') return renderStudents();
  if (t === 'audit') return renderAuditLog();
  if (t === 'settings') return renderSettings();
}

// ---------- overview ----------
async function renderOverview() {
  const o = await Store.adminOverview();
  const rev = ((o.revenueCents || 0) / 100).toFixed(2);
  document.getElementById('panel-overview').innerHTML = `
    <div class="stat-cards">
      <div class="stat-card"><b>${o.students}</b><span>طالب مسجل</span></div>
      <div class="stat-card"><b>${o.enrolled}</b><span>مشترك في الدورة</span></div>
      <div class="stat-card"><b>${o.orders || 0}</b><span>طلب</span></div>
      <div class="stat-card"><b>${o.paidOrders || 0}</b><span>طلب مدفوع</span></div>
      <div class="stat-card${o.pendingOrders ? ' warn' : ''}"><b>${o.pendingOrders || 0}</b><span>طلب معلق ⏳</span></div>
      <div class="stat-card"><b>${o.refunds || 0}</b><span>استرداد</span></div>
      <div class="stat-card"><b>$${rev}</b><span>إجمالي الإيرادات</span></div>
      <div class="stat-card"><b>${o.modules}</b><span>Module</span></div>
      <div class="stat-card"><b>${o.lessons}</b><span>درس</span></div>
    </div>
    ${o.pendingOrders > 0 ? `<div class="pending-alert">⏳ <span><b>${o.pendingOrders} طلبات معلّقة</b> بانتظار تأكيد الدفع اليدوي</span><button class="btn btn-primary btn-sm" id="ov-pending-btn" style="margin-inline-start:auto">مراجعة الطلبات المعلّقة ←</button></div>` : ''}
    <div class="glass"><h3 style="margin-bottom:14px">أحدث الطلاب</h3>
      <div class="table-wrap"><table class="admin-table">
        <tr><th>الاسم</th><th>البريد</th><th>تاريخ التسجيل</th></tr>
        ${o.recent.map((u) => `<tr><td>${E(u.name)}</td><td dir="ltr" style="text-align:left">${E(u.email)}</td><td>${E(u.created_at.slice(0, 10))}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">لا يوجد طلاب بعد</td></tr>'}
      </table></div>
    </div>`;
  const pb = document.getElementById('ov-pending-btn');
  if (pb) pb.onclick = () => { ordersPresetStatus = 'pending'; document.querySelector('[data-tab="orders"]').click(); };
}

// ---------- orders & payments ----------
const ORDER_STATUS_AR = { pending: 'معلق ⏳', paid: 'مدفوع ✅', failed: 'فاشل ❌', cancelled: 'ملغي ↩️', refunded: 'مسترد 💸', disputed: 'نزاع ⚠️' };
let ordersCache = [];
let ordersPresetStatus = '';
async function renderOrders() {
  const panel = document.getElementById('panel-orders');
  panel.innerHTML = `<div class="glass" style="margin-bottom:18px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3>💳 الطلبات والمدفوعات</h3>
      <div style="display:flex;gap:8px">
        <a class="btn btn-ghost btn-sm" href="${Store.exportOrdersCsv()}">⬇ CSV الطلبات</a>
        <a class="btn btn-ghost btn-sm" href="${Store.exportUsersCsv()}">⬇ CSV الطلاب</a>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <input id="orders-q" placeholder="بحث بالبريد أو الاسم أو رقم الجلسة..." style="flex:1;min-width:220px">
      <select id="orders-status" style="min-width:150px">
        <option value="">كل الحالات</option>
        <option value="pending">معلق</option><option value="paid">مدفوع</option>
        <option value="failed">فاشل</option><option value="cancelled">ملغي</option>
        <option value="refunded">مسترد</option><option value="disputed">نزاع</option>
      </select>
      <button class="btn btn-primary btn-sm" id="orders-search">بحث</button>
    </div>
    <div class="table-wrap"><table class="admin-table">
      <tr><th>#</th><th>العميل</th><th>البريد</th><th>المبلغ</th><th>الخصم</th><th>الكوبون</th><th>الحالة</th><th>المصدر</th><th>التاريخ</th><th>إجراء</th></tr>
      <tbody id="orders-rows"><tr><td colspan="10" style="text-align:center;color:var(--muted)">جارٍ التحميل...</td></tr></tbody>
    </table></div></div>`;
  const load = async () => {
    const q = document.getElementById('orders-q').value.trim();
    const status = document.getElementById('orders-status').value;
    try {
      ordersCache = await Store.adminOrders({ q, status });
      document.getElementById('orders-rows').innerHTML = ordersCache.map((o) => `
        <tr><td>${o.id}</td><td>${E(o.user_name || '—')}</td>
        <td dir="ltr" style="text-align:left">${E(o.email)}</td>
        <td><b>${(o.amount / 100).toFixed(2)} ${E(o.currency)}</b></td>
        <td>${o.discount_amount ? (o.discount_amount / 100).toFixed(2) : '—'}</td>
        <td dir="ltr">${E(o.coupon_code || '—')}</td>
        <td>${ORDER_STATUS_AR[o.status] || E(o.status)}</td>
        <td style="color:var(--muted);font-size:.8rem">${E(o.source || '')}</td>
        <td style="color:var(--muted);font-size:.8rem">${E((o.created_at || '').slice(0, 16).replace('T', ' '))}</td>
        <td>${o.status === 'pending' && o.source === 'manual'
          ? `<button class="btn btn-primary btn-sm" data-confirm="${o.id}">✓ تأكيد الدفع</button> <button class="btn btn-ghost btn-sm" data-cancel="${o.id}">إلغاء</button>`
          : '<span style="color:var(--muted)">—</span>'}</td></tr>`).join('')
        || '<tr><td colspan="10" style="text-align:center;color:var(--muted)">لا توجد طلبات مطابقة</td></tr>';
      document.querySelectorAll('[data-confirm]').forEach((b) => b.onclick = async () => {
        if (!confirm('تأكيد استلام الدفع لهذا الطلب؟ سيُفعَّل حساب الطالب مباشرة.')) return;
        b.disabled = true;
        try { await Store.adminConfirmOrder(b.dataset.confirm); App.toast('تم تأكيد الدفع وتفعيل الطالب ✓'); load(); }
        catch (e) { App.toast('تعذر التأكيد'); b.disabled = false; }
      });
      document.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => {
        if (!confirm('إلغاء هذا الطلب المعلق؟')) return;
        b.disabled = true;
        try { await Store.adminCancelOrder(b.dataset.cancel); App.toast('تم إلغاء الطلب'); load(); }
        catch (e) { App.toast('تعذر الإلغاء'); b.disabled = false; }
      });
    } catch (e) { App.toast('تعذر تحميل الطلبات'); }
  };
  if (ordersPresetStatus) { document.getElementById('orders-status').value = ordersPresetStatus; ordersPresetStatus = ''; }
  document.getElementById('orders-search').onclick = load;
  document.getElementById('orders-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  load();
}

// ---------- audit log ----------
async function renderAuditLog() {
  const panel = document.getElementById('panel-audit');
  panel.innerHTML = `<div class="glass"><h3 style="margin-bottom:14px">📋 سجل النشاط</h3>
    <div class="table-wrap"><table class="admin-table">
      <tr><th>الوقت</th><th>الفاعل</th><th>الإجراء</th><th>الهدف</th><th>التفاصيل</th></tr>
      <tbody id="audit-rows"><tr><td colspan="5" style="text-align:center;color:var(--muted)">جارٍ التحميل...</td></tr></tbody>
    </table></div>
    <p style="color:var(--muted);font-size:.85rem;margin-top:10px">يُسجَّل هنا: تغيير الإعدادات والأسعار، تغيير الأدوار، منح/سحب الاشتراكات، إنشاء/تعديل/حذف المحتوى، والمدفوعات.</p></div>`;
  try {
    const rows = await Store.adminAuditLog(150);
    document.getElementById('audit-rows').innerHTML = rows.map((a) => `
      <tr><td style="color:var(--muted);font-size:.8rem;white-space:nowrap">${E((a.created_at || '').slice(0, 16).replace('T', ' '))}</td>
      <td dir="ltr" style="text-align:left;font-size:.85rem">${E(a.actor_email || ('#' + (a.actor_id || 'نظام')))}</td>
      <td><code style="font-size:.8rem">${E(a.action)}</code></td>
      <td style="font-size:.85rem">${E(a.target_type)} ${E(a.target_id)}</td>
      <td style="color:var(--muted);font-size:.85rem">${E(a.details || '')}</td></tr>`).join('')
      || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">لا يوجد نشاط مسجل بعد</td></tr>';
  } catch (e) { App.toast('تعذر تحميل السجل'); }
}

// ---------- content: modules + lessons ----------

async function renderVideos() {
  const panel = document.getElementById('panel-videos');
  let mods, lessons;
  try {
    mods = (await Store.adminList('modules')).sort((a, b) => a.sort_order - b.sort_order);
    lessons = await Store.adminList('lessons');
  } catch (err) {
    panel.innerHTML = '<div class="card" style="padding:30px;text-align:center;color:#ff6b6b">تعذّر تحميل الفيديوهات</div>';
    return;
  }
  const withVideo = lessons.filter(l => l.video_url);
  const withoutVideo = lessons.filter(l => !l.video_url);
  const mp4Count = lessons.filter(l => l.provider === 'mp4').length;
  const ytCount = lessons.filter(l => l.provider === 'youtube' && l.video_url).length;
  panel.innerHTML = `
    <div class="vid-stats">
      <div class="vid-stat"><span class="vid-num">${lessons.length}</span><span>مجموع الدروس</span></div>
      <div class="vid-stat ok"><span class="vid-num">${withVideo.length}</span><span>✅ عندها فيديو</span></div>
      <div class="vid-stat warn"><span class="vid-num">${withoutVideo.length}</span><span>⚠️ بلا فيديو</span></div>
      <div class="vid-stat"><span class="vid-num">${mp4Count}</span><span>🎬 MP4 مباشر</span></div>
      <div class="vid-stat"><span class="vid-num">${ytCount}</span><span>📺 يوتيوب</span></div>
    </div>
    ${withoutVideo.length ? `<div class="vid-alert">⚠️ ${withoutVideo.length} دروس بلا فيديو: ${withoutVideo.map(l => E(l.title)).join('، ')}</div>` : '<div class="vid-ok">✅ كل الدروس عندها فيديو!</div>'}
    <div class="vid-grid">
      ${mods.map(m => {
        const ls = lessons.filter(l => l.module_id === m.id).sort((a, b) => a.sort_order - b.sort_order);
        if (!ls.length) return '';
        return `<div class="vid-module"><h4>${E(m.title)}</h4>
          ${ls.map(l => `
            <div class="vid-card ${l.video_url ? '' : 'no-vid'}">
              <div class="vid-thumb" ${l.video_url ? `onclick="window.open('${E(l.video_url)}','_blank')"` : ''}>
                ${l.thumbnail ? `<img src="${E(l.thumbnail)}" alt="">` : '<span class="vid-play">▶</span>'}
                ${l.video_url ? '<span class="vid-play">▶</span>' : '<span class="vid-missing">⚠️</span>'}
              </div>
              <div class="vid-info">
                <div class="vid-title">${E(l.title)}</div>
                <div class="vid-meta">
                  <span class="pill ${l.provider === 'mp4' ? 'on' : ''}">${E(l.provider || '—')}</span>
                  ${l.is_visible ? '<span class="pill on">ظاهر</span>' : '<span class="pill off">مخفي</span>'}
                  ${l.is_free_preview ? '<span class="pill on">مجاني</span>' : ''}
                </div>
                ${l.video_url
                  ? `<button class="btn btn-sm" onclick="window.open('${E(l.video_url)}','_blank')">🎬 مشاهدة</button>`
                  : `<button class="btn btn-sm btn-primary" onclick="document.querySelector('[data-tab=content]').click()">+ زيد فيديو</button>`}
              </div>
            </div>`).join('')}
        </div>`;
      }).join('')}
    </div>
    <div class="card" style="margin-top:18px;padding:16px">
      <h4 style="margin:0 0 6px">📁 الفيديوهات المرفوعة على المنصة</h4>
      <p style="color:var(--muted);margin:0 0 8px;font-size:.9rem">ملفات محفوظة على المنصة نفسها (تبقى حتى بعد تحديث الموقع). للرفع: افتح إضافة/تعديل درس واختر «📤 أو ارفع فيديو من جهازك».</p>
      <div id="uploaded-videos"><span style="color:var(--muted)">جارٍ التحميل…</span></div>
    </div>`;
  loadUploadedVideos();
}

async function loadUploadedVideos() {
  const box = document.getElementById('uploaded-videos');
  if (!box) return;
  const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  try {
    const r = await fetch('/api/admin/videos', { credentials: 'same-origin' });
    const list = await r.json();
    if (!Array.isArray(list) || !list.length) {
      box.innerHTML = '<span style="color:var(--muted)">لا توجد فيديوهات مرفوعة بعد.</span>';
      return;
    }
    box.innerHTML = list.map((f) => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)">
        <div style="min-width:0">
          <div dir="ltr" style="text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(f.name)}</div>
          <small style="color:var(--muted)">${fmtSize(f.size)} · ${E(String(f.created || '').slice(0, 10))}${f.referenced ? ' · 🔗 مرتبط بدرس' : ''}</small>
        </div>
        <button class="btn btn-sm" data-del-upload="${E(f.name)}" style="color:#ff9a9a;min-height:40px">🗑️ حذف</button>
      </div>`).join('');
    box.querySelectorAll('[data-del-upload]').forEach((btn) => btn.onclick = async () => {
      const name = btn.dataset.delUpload;
      if (!confirm('حذف هذا الفيديو نهائياً من المنصة؟')) return;
      try {
        const m = document.cookie.match(/(?:^|;\s*)tpa_csrf=([^;]*)/);
        const rr = await fetch('/api/admin/videos/' + encodeURIComponent(name), {
          method: 'DELETE', credentials: 'same-origin',
          headers: { 'x-csrf-token': m ? decodeURIComponent(m[1]) : '' },
        });
        const d = await rr.json().catch(() => ({}));
        if (!rr.ok) throw new Error(d.error || 'delete_failed');
        App.toast(d.referenced ? 'تم الحذف — تنبيه: كان مرتبطاً بدرس، حدّث رابط ذلك الدرس' : 'تم حذف الفيديو ✓');
        loadUploadedVideos();
      } catch (e) { App.toast('تعذّر حذف الفيديو', true); }
    });
  } catch (e) {
    box.innerHTML = '<span style="color:#ff6b6b">تعذّر تحميل الفيديوهات المرفوعة</span>';
  }
}

async function renderContent() {
  const panel = document.getElementById('panel-content');
  let mods, lessons;
  try {
    mods = (await Store.adminList('modules')).sort((a, b) => a.sort_order - b.sort_order);
    lessons = await Store.adminList('lessons');
  } catch (err) {
    if (err.code === 'password_change_required') { forcePasswordChangeModal(); return; }
    panel.innerHTML = '<div class="card" style="padding:30px;text-align:center;color:#ff6b6b">تعذّر تحميل المحتوى: ' + (err.message || 'خطأ غير معروف') + '<br><button class="btn btn-sm" style="margin-top:12px" onclick="location.reload()">إعادة المحاولة</button></div>';
    return;
  }
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <h3>Modules الدورة (${mods.length})</h3>
      <button class="btn btn-primary btn-sm" id="add-module">+ إضافة Module</button>
    </div>
    <div class="accordion" id="mods-acc">
      ${mods.map((m, mi) => {
        const ls = lessons.filter((l) => l.module_id === m.id).sort((a, b) => a.sort_order - b.sort_order);
        return `<div class="acc-item">
          <button class="acc-head"><span style="display:flex;align-items:center;gap:12px"><span class="num">${mi + 1}</span>
            <span>${E(m.title)} <small style="color:var(--muted)">(${ls.length} دروس)</small> ${m.is_visible ? '' : '<span class="pill off">مخفي</span>'}</span></span>
            <span class="chev">▾</span></button>
          <div class="acc-body"><div class="acc-body-inner">
            <div class="row-actions" style="margin:10px 0 14px">
              <button class="icon-btn" data-medit="${m.id}">✏️ تعديل</button>
              <button class="icon-btn" data-mvis="${m.id}">${m.is_visible ? '👁️ إخفاء' : '👁️ إظهار'}</button>
              <button class="icon-btn" data-mup="${m.id}" ${mi === 0 ? 'disabled' : ''}>⬆️</button>
              <button class="icon-btn" data-mdown="${m.id}" ${mi === mods.length - 1 ? 'disabled' : ''}>⬇️</button>
              <button class="icon-btn" data-mdel="${m.id}" style="color:#ff9a9a">🗑️ حذف</button>
              <button class="icon-btn" data-ladd="${m.id}" style="border-color:rgba(0,229,160,.4)">+ درس جديد</button>
            </div>
            <div class="table-wrap"><table class="admin-table">
              <tr><th>#</th><th>الدرس</th><th>المدة</th><th>المزود</th><th>الحالة</th><th>إجراءات</th></tr>
              ${ls.map((l, li) => `<tr>
                <td>${li + 1}</td><td>${E(l.title)} ${l.is_free_preview ? '<span class="pill on">معاينة مجانية</span>' : ''}</td>
                <td>${E(l.duration || '—')}</td><td>${E(l.provider)}</td>
                <td>${l.is_visible ? '<span class="pill on">ظاهر</span>' : '<span class="pill off">مخفي</span>'}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" data-lpreview="${l.id}" title="معاينة الفيديو">🎬</button>
                  <button class="icon-btn" data-ledit="${l.id}">✏️</button>
                  <button class="icon-btn" data-lvis="${l.id}">${l.is_visible ? '👁️' : '🚫'}</button>
                  <button class="icon-btn" data-lup="${l.id}">⬆️</button>
                  <button class="icon-btn" data-ldown="${l.id}">⬇️</button>
                  <button class="icon-btn" data-lres="${l.id}">📎 موارد</button>
                  <button class="icon-btn" data-ldel="${l.id}" style="color:#ff9a9a">🗑️</button>
                </div></td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">لا توجد دروس — أضف أول درس</td></tr>'}
            </table></div>
          </div></div></div>`;
      }).join('')}
    </div>`;
  App.initAccordion();

  document.getElementById('add-module').onclick = () => openModal('إضافة Module جديد', [
    { label: 'عنوان الـ Module', value: '' },
    { label: 'الوصف', type: 'textarea', value: '' },
  ], async ([title, description]) => {
    await Store.adminCreate('modules', { title, description, sort_order: mods.length, is_visible: 1 });
    App.toast('تمت الإضافة ✓'); renderContent();
  });

  panel.onclick = async (e) => {
    const b = e.target.closest('[data-medit],[data-mvis],[data-mup],[data-mdown],[data-mdel],[data-ladd],[data-ledit],[data-lvis],[data-lup],[data-ldown],[data-ldel],[data-lres],[data-lpreview]');
    if (b && b.hasAttribute('data-lpreview')) {
      const l = lessons.find(x => x.id == b.getAttribute('data-lpreview'));
      if (l && l.video_url) {
        window.open(l.video_url, '_blank');
      } else {
        App.toast('لا يوجد فيديو لهذا الدرس');
      }
      return;
    }
    if (!b) return;
    const get = (k) => b.dataset[k];
    const swapOrder = async (table, a, c) => {
      await Store.adminUpdate(table, a.id, { sort_order: c.sort_order });
      await Store.adminUpdate(table, c.id, { sort_order: a.sort_order });
    };
    if (get('medit')) {
      const m = mods.find((x) => x.id === +get('medit'));
      openModal('تعديل Module', [
        { label: 'العنوان', value: m.title }, { label: 'الوصف', type: 'textarea', value: m.description },
      ], async ([title, description]) => { await Store.adminUpdate('modules', m.id, { title, description }); App.toast('تم الحفظ ✓'); renderContent(); });
    } else if (get('mvis')) {
      const m = mods.find((x) => x.id === +get('mvis'));
      await Store.adminUpdate('modules', m.id, { is_visible: m.is_visible ? 0 : 1 }); renderContent();
    } else if (get('mup') || get('mdown')) {
      const i = mods.findIndex((x) => x.id === +(get('mup') || get('mdown')));
      const j = get('mup') ? i - 1 : i + 1;
      if (mods[j]) { await swapOrder('modules', mods[i], mods[j]); renderContent(); }
    } else if (get('mdel')) {
      if (confirm('حذف هذا الـ Module مع كل دروسه؟')) { await Store.adminDelete('modules', +get('mdel')); renderContent(); }
    } else if (get('ladd')) {
      const mid = +get('ladd');
      const count = lessons.filter((l) => l.module_id === mid).length;
      openModal('إضافة درس جديد', lessonFields({}), async (v) => {
        await Store.adminCreate('lessons', { module_id: mid, title: v[0], video_url: v[1], thumbnail: v[3], description: v[4], duration: v[5], provider: v[6], sort_order: count, is_visible: v[7], is_free_preview: v[8] });
        App.toast('تمت إضافة الدرس ✓'); renderContent();
      });
    } else if (get('ledit')) {
      const l = lessons.find((x) => x.id === +get('ledit'));
      openModal('تعديل الدرس', lessonFields(l), async (v) => {
        await Store.adminUpdate('lessons', l.id, { title: v[0], video_url: v[1], thumbnail: v[3], description: v[4], duration: v[5], provider: v[6], is_visible: v[7], is_free_preview: v[8] });
        App.toast('تم الحفظ ✓'); renderContent();
      });
    } else if (get('lvis')) {
      const l = lessons.find((x) => x.id === +get('lvis'));
      await Store.adminUpdate('lessons', l.id, { is_visible: l.is_visible ? 0 : 1 }); renderContent();
    } else if (get('lup') || get('ldown')) {
      const l = lessons.find((x) => x.id === +(get('lup') || get('ldown')));
      const ls = lessons.filter((x) => x.module_id === l.module_id).sort((a, c) => a.sort_order - c.sort_order);
      const i = ls.findIndex((x) => x.id === l.id);
      const j = get('lup') ? i - 1 : i + 1;
      if (ls[j]) { await swapOrder('lessons', ls[i], ls[j]); renderContent(); }
    } else if (get('ldel')) {
      if (confirm('حذف هذا الدرس؟')) { await Store.adminDelete('lessons', +get('ldel')); renderContent(); }
    } else if (get('lres')) {
      renderResources(+get('lres'));
      document.querySelector('[data-tab="site"]').click(); // switch handled below manually
    }
  };
}

function lessonFields(l) {
  return [
    { label: 'عنوان الدرس', value: l.title || '' },
    { label: 'رابط الفيديو', value: l.video_url || '', dir: 'ltr', hint: 'رابط YouTube / Vimeo / Cloudflare / MP4' },
    { label: '📤 أو ارفع فيديو من جهازك', type: 'videoupload', targetId: 'mf-1', providerId: 'mf-6', hint: 'MP4 أو WebM — حتى 1GB — يُحفظ على المنصة' },
    { label: 'رابط الصورة المصغرة (Thumbnail)', value: l.thumbnail || '', dir: 'ltr' },
    { label: 'وصف الدرس', type: 'textarea', value: l.description || '' },
    { label: 'المدة', value: l.duration || '', hint: 'مثال: 12:30' },
    { label: 'مزود الفيديو', type: 'select', options: PROVIDERS, value: l.provider || 'youtube' },
    { label: 'ظاهر للطلاب', type: 'checkbox', value: l.is_visible ?? 1 },
    { label: 'معاينة مجانية', type: 'checkbox', value: l.is_free_preview ?? 0 },
  ];
}

// ---------- resources for a lesson ----------
let resLessonId = null;
async function renderResources(lessonId) {
  resLessonId = lessonId;
  const all = await Store.adminList('resources');
  const list = all.filter((r) => r.lesson_id === lessonId);
  const lessons = await Store.adminList('lessons');
  const lesson = lessons.find((l) => l.id === lessonId);
  const panel = document.getElementById('panel-site');
  document.querySelectorAll('.admin-tab').forEach((t) => t.classList.remove('active'));
  document.querySelector('[data-tab="site"]').classList.add('active');
  document.querySelectorAll('.admin-panel').forEach((p) => p.classList.remove('active'));
  panel.classList.add('active');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <h3>📎 موارد الدرس: ${E(lesson ? lesson.title : '')}</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" id="res-back">→ عودة للمحتوى</button>
        <button class="btn btn-primary btn-sm" id="res-add">+ إضافة ملف</button>
      </div>
    </div>
    <div class="table-wrap"><table class="admin-table">
      <tr><th>العنوان</th><th>النوع</th><th>عام؟</th><th>الرابط</th><th>إجراءات</th></tr>
      ${list.map((r) => `<tr><td>${E(r.title)}</td><td>${E(r.file_type)}</td><td>${r.is_public ? '✅' : '🔒'}</td>
        <td dir="ltr" style="text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(r.file_url)}</td>
        <td><div class="row-actions"><button class="icon-btn" data-redel="${r.id}" style="color:#ff9a9a">🗑️</button></div></td></tr>`).join('')
        || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">لا توجد ملفات — أضف PDF أو Checklist أو Excel</td></tr>'}
    </table></div>`;
  document.getElementById('res-back').onclick = () => { resLessonId = null; document.querySelector('[data-tab="content"]').click(); };
  document.getElementById('res-add').onclick = () => openModal('إضافة ملف للدرس', [
    { label: 'عنوان الملف', value: '' },
    { label: 'رابط الملف', value: '', dir: 'ltr', hint: 'رابط مباشر للـ PDF / Excel / ...' },
    { label: 'النوع', type: 'select', options: [['pdf', 'PDF'], ['checklist', 'Checklist'], ['excel', 'Excel/CSV'], ['other', 'أخرى']], value: 'pdf' },
    { label: 'مورد عام يظهر في الدرس المجاني', type: 'checkbox', value: 0 },
  ], async ([title, file_url, file_type, is_public]) => {
    await Store.adminCreate('resources', { lesson_id: lessonId, title, file_url, file_type, is_public: is_public ? 1 : 0 });
    App.toast('تمت الإضافة ✓'); renderResources(lessonId);
  });
  panel.querySelectorAll('[data-redel]').forEach((btn) => btn.onclick = async () => {
    if (confirm('حذف هذا الملف؟')) { await Store.adminDelete('resources', +btn.dataset.redel); renderResources(lessonId); }
  });
}

    if (d.editBonus !== undefined) {
      const it = bonuses.find((x) => x.id === +d.editBonus); if (!it) return;
      openModal('تعديل بونص', [
        { label: 'العنوان', value: it.title }, { label: 'الوصف', type: 'textarea', value: it.description || '' },
      ], async ([title, description]) => { await Store.adminUpdate('bonuses', it.id, { title, description }); App.toast('تم الحفظ ✓'); renderSite(); });
      return;
    }
    if (d.editFaq !== undefined) {
      const it = faqs.find((x) => x.id === +d.editFaq); if (!it) return;
      openModal('تعديل سؤال شائع', [
        { label: 'السؤال', value: it.question }, { label: 'الجواب', type: 'textarea', value: it.answer },
      ], async ([question, answer]) => { await Store.adminUpdate('faqs', it.id, { question, answer }); App.toast('تم الحفظ ✓'); renderSite(); });
      return;
    }
    if (d.editCoupon !== undefined) {
      const it = coupons.find((x) => x.id === +d.editCoupon); if (!it) return;
      openModal('تعديل كود الخصم', [
        { label: 'الكود', value: it.code, dir: 'ltr' }, { label: 'نسبة الخصم %', type: 'number', value: it.percent_off },
      ], async ([code, percent_off]) => { await Store.adminUpdate('coupons', it.id, { code: code.toUpperCase(), percent_off }); App.toast('تم الحفظ ✓'); renderSite(); });
      return;
    }
    const table = d.delBonus !== undefined || d.visBonus !== undefined ? 'bonuses'
      : d.delFaq !== undefined || d.visFaq !== undefined ? 'faqs'
      : d.delCoupon !== undefined || d.visCoupon !== undefined ? 'coupons' : 'testimonials';
    const id = +(d.delBonus || d.visBonus || d.delFaq || d.visFaq || d.delCoupon || d.visCoupon || d.delTesti);
    if (d.delBonus !== undefined || d.delFaq !== undefined || d.delCoupon !== undefined || d.delTesti !== undefined) {
      if (confirm('حذف هذا العنصر؟')) { await Store.adminDelete(table, id); renderSite(); }
    } else {
      const all = { bonuses, faqs, coupons }[table];
      const item = all.find((x) => x.id === id);
      const field = table === 'coupons' ? 'is_active' : 'is_visible';
      await Store.adminUpdate(table, id, { [field]: item[field] ? 0 : 1 });
      renderSite();
    }
  };
}

// ---------- students ----------
async function renderStudents() {
  const list = await Store.adminUsers();
  const ME = window.ME || {};
  const iAmSuper = ME.role === 'super_admin';
  const panel = document.getElementById('panel-students');
  panel.innerHTML = `
    <div class="glass"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <h3>👥 الطلاب والمستخدمون (<span id="students-count">${list.length}</span>)</h3>
      <input id="students-q" placeholder="بحث بالاسم أو البريد..." style="min-width:220px">
    </div>
    <div class="table-wrap"><table class="admin-table">
      <tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الاشتراك</th><th>إجراءات</th></tr>
      <tbody id="students-rows"></tbody>
    </table></div>
    <p style="color:var(--muted);font-size:.88rem;margin-top:12px">💡 "تفعيل الاشتراك" يمنح الطالب الوصول الفوري للدورة — استعمله بعد تأكيد الدفع اليدوي. حسابات 👑 المالك محمية: لا يعدّلها أو يحذفها إلا مالك آخر، ولا يمكن حذف آخر مالك.</p></div>`;
  const rolePill = (u) => u.role === 'super_admin' ? '<span class="pill owner">👑 مالك</span>'
    : u.role === 'admin' ? '<span class="pill on">Admin 🛠</span>' : '<span class="pill">طالب</span>';
  const errToast = (e, fallback) => App.toast(
    e.code === 'cannot_remove_last_admin' ? 'لا يمكن إزالة آخر Admin في النظام'
    : e.code === 'cannot_remove_last_super_admin' ? 'لا يمكن تنزيل أو حذف آخر مالك 👑'
    : e.code === 'cannot_demote_self' ? 'لا يمكنك تنزيل نفسك'
    : e.code === 'cannot_delete_self' ? 'لا يمكنك حذف حسابك'
    : e.code === 'super_admin_protected' ? 'هذا الحساب مالك 👑 — لا يعدّله إلا مالك آخر'
    : fallback, true);
  const draw = (filter) => {
    const f = (filter || '').toLowerCase();
    const rows = list.filter((u) => !f || u.name.toLowerCase().includes(f) || u.email.toLowerCase().includes(f));
    document.getElementById('students-count').textContent = rows.length;
    document.getElementById('students-rows').innerHTML = rows.map((u) => {
      const isSelf = ME.id === u.id;
      const protectedRow = u.role === 'super_admin' && !iAmSuper;
      const actions = [];
      if (isSelf) {
        actions.push('<span style="color:var(--muted);font-size:.8rem">(حسابك — محمي من التعديل الذاتي)</span>');
      } else if (protectedRow) {
        actions.push(`<button class="icon-btn" data-enroll="${u.id}" data-on="${u.enrolled ? 0 : 1}">${u.enrolled ? 'إلغاء الاشتراك' : 'تفعيل الاشتراك'}</button>`);
        actions.push('<span style="color:var(--muted);font-size:.8rem">🔒 مالك محمي</span>');
      } else {
        actions.push(`<button class="icon-btn" data-enroll="${u.id}" data-on="${u.enrolled ? 0 : 1}">${u.enrolled ? 'إلغاء الاشتراك' : 'تفعيل الاشتراك'}</button>`);
        if (u.role === 'student') actions.push(`<button class="icon-btn" data-role="${u.id}" data-r="admin">⬆ ترقية Admin</button>`);
        if (u.role === 'admin') actions.push(`<button class="icon-btn" data-role="${u.id}" data-r="student">⬇ تنزيل لطالب</button>`);
        if (u.role === 'super_admin') actions.push(`<button class="icon-btn" data-role="${u.id}" data-r="admin">⬇ تنزيل لـ Admin</button>`);
        actions.push(`<button class="icon-btn" data-deluser="${u.id}" data-email="${E(u.email)}" style="color:#ff9a9a">🗑️ حذف</button>`);
      }
      return `<tr class="${isSelf ? 'row-self' : ''}"><td>${E(u.name)}${isSelf ? ' <small style="color:var(--muted)">(أنت)</small>' : ''}</td><td dir="ltr" style="text-align:left">${E(u.email)}</td>
        <td>${rolePill(u)}</td>
        <td>${u.enrolled ? '<span class="pill on">مشترك ✓</span>' : '<span class="pill off">غير مشترك</span>'}</td>
        <td><div class="row-actions">${actions.join('')}</div></td></tr>`;
    }).join('')
      || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">لا نتائج</td></tr>';
    bindStudentButtons();
  };
  const bindStudentButtons = () => {
    panel.querySelectorAll('[data-enroll]').forEach((btn) => btn.onclick = async () => {
      if (btn.dataset.on === '0' && !confirm('إلغاء اشتراك هذا الطالب؟ سيفقد الوصول للدروس.')) return;
      try { await Store.adminEnroll(+btn.dataset.enroll, btn.dataset.on === '1'); }
      catch (e) { errToast(e, 'تعذر تعديل الاشتراك'); return; }
      App.toast('تم ✓');
      const u = list.find((x) => x.id === +btn.dataset.enroll);
      if (u) u.enrolled = btn.dataset.on === '1' ? 1 : 0;
      draw(document.getElementById('students-q').value);
    });
    panel.querySelectorAll('[data-role]').forEach((btn) => btn.onclick = async () => {
      if (!confirm('تغيير دور هذا المستخدم؟')) return;
      try { await Store.adminRole(+btn.dataset.role, btn.dataset.r); App.toast('تم تغيير الدور ✓'); renderStudents(); }
      catch (e) { errToast(e, 'تعذر تغيير الدور'); }
    });
    panel.querySelectorAll('[data-deluser]').forEach((btn) => btn.onclick = async () => {
      if (!confirm('⚠️ حذف المستخدم ' + btn.dataset.email + ' نهائياً؟\nسيُحذف حسابه واشتراكه وتقدّمه في الدورة، ولا يمكن التراجع.')) return;
      try { await Store.adminDeleteUser(+btn.dataset.deluser); App.toast('تم حذف المستخدم'); renderStudents(); }
      catch (e) { errToast(e, 'تعذر الحذف'); }
    });
  };
  document.getElementById('students-q').addEventListener('input', (e) => draw(e.target.value));
  draw('');
}

  ]},
];
async function renderSettings() {
  let s;
  try { s = await Store.adminSettings(); } catch { s = await Store.settings(); }
  const panel = document.getElementById('panel-settings');
  panel.innerHTML = SETTING_GROUPS.map((g, gi) => `
    <div class="glass" style="margin-bottom:18px"><h3 style="margin-bottom:14px">${g.title}</h3>
    <div class="settings-grid">
    ${g.keys.map(([key, label, type, dir, options]) => {
      const v = s[key] ?? '';
      let input;
      if (type === 'textarea') input = `<textarea id="set-${key}" rows="3">${E(v)}</textarea>`;
      else if (type === 'select') input = `<select id="set-${key}">${options.map((o) => `<option value="${o[0]}" ${v === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
      else input = `<input id="set-${key}" value="${E(v)}" ${dir ? `dir="${dir}" style="text-align:left"` : ''}>`;
      return `<div class="field"><label><code dir="ltr" style="color:var(--green)">${key}</code> — ${label}</label>${input}</div>`;
    }).join('')}
    </div></div>`).join('') +
    `<button class="btn btn-primary btn-lg btn-block" id="save-settings">💾 حفظ كل الإعدادات</button>`;
  document.getElementById('save-settings').onclick = async () => {
    const obj = {};
    SETTING_GROUPS.forEach((g) => g.keys.forEach(([key]) => { obj[key] = document.getElementById('set-' + key).value; }));
    try { await Store.adminSaveSettings(obj); App.toast('تم حفظ الإعدادات ✓'); }
    catch (e) { App.toast('تعذر الحفظ — تحقق من صيغة الحقول (السعر/الروابط/الأرقام)', true); }
  };
}

// ---------- boot ----------
function forcePasswordChangeModal() {
  openModal('🔒 تغيير كلمة المرور مطلوب', [
    { label: 'كلمة المرور الجديدة (8 أحرف على الأقل)', type: 'password', value: '' },
    { label: 'تأكيد كلمة المرور', type: 'password', value: '' },
  ], async ([p1, p2]) => {
    if (!p1 || p1.length < 8) { App.toast('كلمة المرور قصيرة'); throw new Error('short'); }
    if (p1 !== p2) { App.toast('كلمتا المرور غير متطابقتين'); throw new Error('mismatch'); }
    await Store.changePassword('', p1);
    App.toast('تم تغيير كلمة المرور ✓');
    location.reload();
  });
  document.getElementById('modal-cancel').style.display = 'none';
  document.getElementById('modal-back').onclick = null;
}
(async function () {
  await App.renderHeader();
  let user;
  try { user = await Store.me(); } catch {}
  if (!user || (user.role !== 'admin' && user.role !== 'super_admin')) { location.href = '/admin/login'; return; }
  window.ME = user;
  await App.applySettings();
  try { await Store.adminOverview(); }
  catch (e) {
    if (e.code === 'password_change_required') { forcePasswordChangeModal(); return; }
    throw e;
  }
  renderOverview();
})();

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | {{SEO_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script><script src="/js/store.js"></script><script src="/js/app.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="container" style="padding-bottom:70px">
  <h1 style="margin-top:30px">لوحة الإدارة 🛠</h1>
  <p style="color:var(--muted)">إدارة المحتوى والطلاب وإعدادات الموقع — كل التعديلات تظهر فوراً على الموقع.</p>

  <div class="admin-tabs" id="tabs">
    <button class="admin-tab active" data-tab="overview">نظرة عامة</button>
    <button class="admin-tab" data-tab="content">المحتوى (Modules والدروس)</button>
    <button class="admin-tab" data-tab="site">نصوص الموقع</button>
    <button class="admin-tab" data-tab="students">الطلاب</button>
    <button class="admin-tab" data-tab="settings">الإعدادات</button>
  </div>

  <div class="admin-panel active" id="panel-overview"></div>
  <div class="admin-panel" id="panel-content"></div>
  <div class="admin-panel" id="panel-site"></div>
  <div class="admin-panel" id="panel-students"></div>
  <div class="admin-panel" id="panel-settings"></div>
</div>

<div class="modal-back" id="modal-back"><div class="modal">
  <h3 id="modal-title"></h3><div id="modal-fields"></div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="btn btn-primary" id="modal-save" style="flex:1">حفظ</button>
    <button class="btn btn-ghost" id="modal-cancel">إلغاء</button>
  </div>
</div></div>

<script>
const E = App.esc;
// ---------- generic modal ----------
function openModal(title, fields, onSave) {
  document.getElementById('modal-title').textContent = title;
  const wrap = document.getElementById('modal-fields');
  wrap.innerHTML = fields.map((f, i) => {
    const v = f.value ?? '';
    let input;
    if (f.type === 'textarea') input = `<textarea id="mf-${i}" rows="4">${E(v)}</textarea>`;
    else if (f.type === 'select') input = `<select id="mf-${i}">${f.options.map((o) => `<option value="${o[0]}" ${String(v) === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
    else if (f.type === 'checkbox') input = `<input type="checkbox" id="mf-${i}" ${v ? 'checked' : ''} style="width:auto;transform:scale(1.4)">`;
    else input = `<input type="${f.type || 'text'}" id="mf-${i}" value="${E(v)}" ${f.dir ? `dir="${f.dir}"` : ''}>`;
    return `<div class="field"><label>${f.label}${f.hint ? ` <small style="color:var(--muted)">${f.hint}</small>` : ''}</label>${input}</div>`;
  }).join('');
  document.getElementById('modal-back').classList.add('show');
  document.getElementById('modal-save').onclick = async () => {
    const vals = fields.map((f, i) => {
      const el = document.getElementById('mf-' + i);
      if (f.type === 'checkbox') return el.checked ? 1 : 0;
      if (f.type === 'number') return parseInt(el.value || '0', 10);
      return el.value;
    });
    try { await onSave(vals); closeModal(); }
    catch (e) { App.toast('تعذر الحفظ'); }
  };
}
function closeModal() { document.getElementById('modal-back').classList.remove('show'); }
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-back').addEventListener('click', (e) => { if (e.target.id === 'modal-back') closeModal(); });

const PROVIDERS = [['youtube', 'YouTube'], ['vimeo', 'Vimeo'], ['cloudflare', 'Cloudflare Stream'], ['mp4', 'رابط MP4 مباشر']];

// ---------- tabs ----------
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.admin-tab'); if (!b) return;
  document.querySelectorAll('.admin-tab').forEach((t) => t.classList.remove('active'));
  document.querySelectorAll('.admin-panel').forEach((p) => p.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('panel-' + b.dataset.tab).classList.add('active');
  loadTab(b.dataset.tab);
});

async function loadTab(t) {
  if (t === 'overview') return renderOverview();
  if (t === 'content') return renderContent();
  if (t === 'site') return renderSite();
  if (t === 'students') return renderStudents();
  if (t === 'settings') return renderSettings();
}

// ---------- overview ----------
async function renderOverview() {
  const o = await Store.adminOverview();
  document.getElementById('panel-overview').innerHTML = `
    <div class="stat-cards">
      <div class="stat-card"><b>${o.students}</b><span>طالب مسجل</span></div>
      <div class="stat-card"><b>${o.enrolled}</b><span>مشترك في الدورة</span></div>
      <div class="stat-card"><b>${o.modules}</b><span>Module</span></div>
      <div class="stat-card"><b>${o.lessons}</b><span>درس</span></div>
    </div>
    <div class="glass"><h3 style="margin-bottom:14px">أحدث الطلاب</h3>
      <div class="table-wrap"><table class="admin-table">
        <tr><th>الاسم</th><th>البريد</th><th>تاريخ التسجيل</th></tr>
        ${o.recent.map((u) => `<tr><td>${E(u.name)}</td><td dir="ltr" style="text-align:left">${E(u.email)}</td><td>${E(u.created_at.slice(0, 10))}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">لا يوجد طلاب بعد</td></tr>'}
      </table></div>
    </div>`;
}

// ---------- content: modules + lessons ----------
async function renderContent() {
  const mods = (await Store.adminList('modules')).sort((a, b) => a.sort_order - b.sort_order);
  const lessons = await Store.adminList('lessons');
  const panel = document.getElementById('panel-content');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <h3>Modules الدورة (${mods.length})</h3>
      <button class="btn btn-primary btn-sm" id="add-module">+ إضافة Module</button>
    </div>
    <div class="accordion" id="mods-acc">
      ${mods.map((m, mi) => {
        const ls = lessons.filter((l) => l.module_id === m.id).sort((a, b) => a.sort_order - b.sort_order);
        return `<div class="acc-item">
          <button class="acc-head"><span style="display:flex;align-items:center;gap:12px"><span class="num">${mi + 1}</span>
            <span>${E(m.title)} <small style="color:var(--muted)">(${ls.length} دروس)</small> ${m.is_visible ? '' : '<span class="pill off">مخفي</span>'}</span></span>
            <span class="chev">▾</span></button>
          <div class="acc-body"><div class="acc-body-inner">
            <div class="row-actions" style="margin:10px 0 14px">
              <button class="icon-btn" data-medit="${m.id}">✏️ تعديل</button>
              <button class="icon-btn" data-mvis="${m.id}">${m.is_visible ? '👁️ إخفاء' : '👁️ إظهار'}</button>
              <button class="icon-btn" data-mup="${m.id}" ${mi === 0 ? 'disabled' : ''}>⬆️</button>
              <button class="icon-btn" data-mdown="${m.id}" ${mi === mods.length - 1 ? 'disabled' : ''}>⬇️</button>
              <button class="icon-btn" data-mdel="${m.id}" style="color:#ff9a9a">🗑️ حذف</button>
              <button class="icon-btn" data-ladd="${m.id}" style="border-color:rgba(0,229,160,.4)">+ درس جديد</button>
            </div>
            <div class="table-wrap"><table class="admin-table">
              <tr><th>#</th><th>الدرس</th><th>المدة</th><th>المزود</th><th>الحالة</th><th>إجراءات</th></tr>
              ${ls.map((l, li) => `<tr>
                <td>${li + 1}</td><td>${E(l.title)} ${l.is_free_preview ? '<span class="pill on">معاينة مجانية</span>' : ''}</td>
                <td>${E(l.duration || '—')}</td><td>${E(l.provider)}</td>
                <td>${l.is_visible ? '<span class="pill on">ظاهر</span>' : '<span class="pill off">مخفي</span>'}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" data-ledit="${l.id}">✏️</button>
                  <button class="icon-btn" data-lvis="${l.id}">${l.is_visible ? '👁️' : '🚫'}</button>
                  <button class="icon-btn" data-lup="${l.id}">⬆️</button>
                  <button class="icon-btn" data-ldown="${l.id}">⬇️</button>
                  <button class="icon-btn" data-lres="${l.id}">📎 موارد</button>
                  <button class="icon-btn" data-ldel="${l.id}" style="color:#ff9a9a">🗑️</button>
                </div></td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">لا توجد دروس — أضف أول درس</td></tr>'}
            </table></div>
          </div></div></div>`;
      }).join('')}
    </div>`;
  App.initAccordion();

  document.getElementById('add-module').onclick = () => openModal('إضافة Module جديد', [
    { label: 'عنوان الـ Module', value: '' },
    { label: 'الوصف', type: 'textarea', value: '' },
  ], async ([title, description]) => {
    await Store.adminCreate('modules', { title, description, sort_order: mods.length, is_visible: 1 });
    App.toast('تمت الإضافة ✓'); renderContent();
  });

  panel.onclick = async (e) => {
    const b = e.target.closest('[data-medit],[data-mvis],[data-mup],[data-mdown],[data-mdel],[data-ladd],[data-ledit],[data-lvis],[data-lup],[data-ldown],[data-ldel],[data-lres]');
    if (!b) return;
    const get = (k) => b.dataset[k];
    const swapOrder = async (table, a, c) => {
      await Store.adminUpdate(table, a.id, { sort_order: c.sort_order });
      await Store.adminUpdate(table, c.id, { sort_order: a.sort_order });
    };
    if (get('medit')) {
      const m = mods.find((x) => x.id === +get('medit'));
      openModal('تعديل Module', [
        { label: 'العنوان', value: m.title }, { label: 'الوصف', type: 'textarea', value: m.description },
      ], async ([title, description]) => { await Store.adminUpdate('modules', m.id, { title, description }); App.toast('تم الحفظ ✓'); renderContent(); });
    } else if (get('mvis')) {
      const m = mods.find((x) => x.id === +get('mvis'));
      await Store.adminUpdate('modules', m.id, { is_visible: m.is_visible ? 0 : 1 }); renderContent();
    } else if (get('mup') || get('mdown')) {
      const i = mods.findIndex((x) => x.id === +(get('mup') || get('mdown')));
      const j = get('mup') ? i - 1 : i + 1;
      if (mods[j]) { await swapOrder('modules', mods[i], mods[j]); renderContent(); }
    } else if (get('mdel')) {
      if (confirm('حذف هذا الـ Module مع كل دروسه؟')) { await Store.adminDelete('modules', +get('mdel')); renderContent(); }
    } else if (get('ladd')) {
      const mid = +get('ladd');
      const count = lessons.filter((l) => l.module_id === mid).length;
      openModal('إضافة درس جديد', lessonFields({}), async (v) => {
        await Store.adminCreate('lessons', { module_id: mid, title: v[0], video_url: v[1], thumbnail: v[2], description: v[3], duration: v[4], provider: v[5], sort_order: count, is_visible: v[6], is_free_preview: v[7] });
        App.toast('تمت إضافة الدرس ✓'); renderContent();
      });
    } else if (get('ledit')) {
      const l = lessons.find((x) => x.id === +get('ledit'));
      openModal('تعديل الدرس', lessonFields(l), async (v) => {
        await Store.adminUpdate('lessons', l.id, { title: v[0], video_url: v[1], thumbnail: v[2], description: v[3], duration: v[4], provider: v[5], is_visible: v[6], is_free_preview: v[7] });
        App.toast('تم الحفظ ✓'); renderContent();
      });
    } else if (get('lvis')) {
      const l = lessons.find((x) => x.id === +get('lvis'));
      await Store.adminUpdate('lessons', l.id, { is_visible: l.is_visible ? 0 : 1 }); renderContent();
    } else if (get('lup') || get('ldown')) {
      const l = lessons.find((x) => x.id === +(get('lup') || get('ldown')));
      const ls = lessons.filter((x) => x.module_id === l.module_id).sort((a, c) => a.sort_order - c.sort_order);
      const i = ls.findIndex((x) => x.id === l.id);
      const j = get('lup') ? i - 1 : i + 1;
      if (ls[j]) { await swapOrder('lessons', ls[i], ls[j]); renderContent(); }
    } else if (get('ldel')) {
      if (confirm('حذف هذا الدرس؟')) { await Store.adminDelete('lessons', +get('ldel')); renderContent(); }
    } else if (get('lres')) {
      renderResources(+get('lres'));
      document.querySelector('[data-tab="site"]').click(); // switch handled below manually
    }
  };
}

function lessonFields(l) {
  return [
    { label: 'عنوان الدرس', value: l.title || '' },
    { label: 'رابط الفيديو', value: l.video_url || '', dir: 'ltr', hint: 'رابط YouTube / Vimeo / Cloudflare / MP4' },
    { label: 'رابط الصورة المصغرة (Thumbnail)', value: l.thumbnail || '', dir: 'ltr' },
    { label: 'وصف الدرس', type: 'textarea', value: l.description || '' },
    { label: 'المدة', value: l.duration || '', hint: 'مثال: 12:30' },
    { label: 'مزود الفيديو', type: 'select', options: PROVIDERS, value: l.provider || 'youtube' },
    { label: 'ظاهر للطلاب', type: 'checkbox', value: l.is_visible ?? 1 },
    { label: 'معاينة مجانية', type: 'checkbox', value: l.is_free_preview ?? 0 },
  ];
}

// ---------- resources for a lesson ----------
let resLessonId = null;
async function renderResources(lessonId) {
  resLessonId = lessonId;
  const all = await Store.adminList('resources');
  const list = all.filter((r) => r.lesson_id === lessonId);
  const lessons = await Store.adminList('lessons');
  const lesson = lessons.find((l) => l.id === lessonId);
  const panel = document.getElementById('panel-site');
  document.querySelectorAll('.admin-tab').forEach((t) => t.classList.remove('active'));
  document.querySelector('[data-tab="site"]').classList.add('active');
  document.querySelectorAll('.admin-panel').forEach((p) => p.classList.remove('active'));
  panel.classList.add('active');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <h3>📎 موارد الدرس: ${E(lesson ? lesson.title : '')}</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" id="res-back">→ عودة للمحتوى</button>
        <button class="btn btn-primary btn-sm" id="res-add">+ إضافة ملف</button>
      </div>
    </div>
    <div class="table-wrap"><table class="admin-table">
      <tr><th>العنوان</th><th>النوع</th><th>الرابط</th><th>إجراءات</th></tr>
      ${list.map((r) => `<tr><td>${E(r.title)}</td><td>${E(r.file_type)}</td>
        <td dir="ltr" style="text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(r.file_url)}</td>
        <td><div class="row-actions"><button class="icon-btn" data-redel="${r.id}" style="color:#ff9a9a">🗑️</button></div></td></tr>`).join('')
        || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">لا توجد ملفات — أضف PDF أو Checklist أو Excel</td></tr>'}
    </table></div>`;
  document.getElementById('res-back').onclick = () => { resLessonId = null; document.querySelector('[data-tab="content"]').click(); };
  document.getElementById('res-add').onclick = () => openModal('إضافة ملف للدرس', [
    { label: 'عنوان الملف', value: '' },
    { label: 'رابط الملف', value: '', dir: 'ltr', hint: 'رابط مباشر للـ PDF / Excel / ...' },
    { label: 'النوع', type: 'select', options: [['pdf', 'PDF'], ['checklist', 'Checklist'], ['excel', 'Excel/CSV'], ['other', 'أخرى']], value: 'pdf' },
  ], async ([title, file_url, file_type]) => {
    await Store.adminCreate('resources', { lesson_id: lessonId, title, file_url, file_type });
    App.toast('تمت الإضافة ✓'); renderResources(lessonId);
  });
  panel.querySelectorAll('[data-redel]').forEach((btn) => btn.onclick = async () => {
    if (confirm('حذف هذا الملف؟')) { await Store.adminDelete('resources', +btn.dataset.redel); renderResources(lessonId); }
  });
}

// ---------- site texts: bonuses / faqs / testimonials / coupons ----------
async function renderSite() {
  if (resLessonId && document.getElementById('res-add')) return; // resources view active
  const [bonuses, faqs, testis, coupons] = await Promise.all([
    Store.adminList('bonuses'), Store.adminList('faqs'), Store.adminList('testimonials'), Store.adminList('coupons'),
  ]);
  const panel = document.getElementById('panel-site');
  const block = (title, addId, rows, cols, delKey) => `
    <div class="glass" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3>${title}</h3><button class="btn btn-primary btn-sm" id="${addId}">+ إضافة</button>
      </div>
      <div class="table-wrap"><table class="admin-table"><tr>${cols.map((c) => `<th>${c}</th>`).join('')}<th>إجراءات</th></tr>
      ${rows.map((r) => `<tr>${r.cells}<td><div class="row-actions">
        <button class="icon-btn" data-edit-${delKey}="${r.id}">✏️</button>
        <button class="icon-btn" data-vis-${delKey}="${r.id}">${r.visible ? '👁️' : '🚫'}</button>
        <button class="icon-btn" data-del-${delKey}="${r.id}" style="color:#ff9a9a">🗑️</button></div></td></tr>`).join('')
        || `<tr><td colspan="${cols.length + 1}" style="text-align:center;color:var(--muted)">فارغ</td></tr>`}
      </table></div></div>`;

  panel.innerHTML =
    block('🎁 البونص (يظهر في بطاقة السعر)', 'add-bonus',
      bonuses.map((b) => ({ id: b.id, visible: b.is_visible, cells: `<td>${E(b.title)}</td><td style="color:var(--muted)">${E(b.description || '')}</td>` })),
      ['العنوان', 'الوصف'], 'bonus') +
    block('❓ الأسئلة الشائعة', 'add-faq',
      faqs.map((f) => ({ id: f.id, visible: f.is_visible, cells: `<td>${E(f.question)}</td><td style="color:var(--muted)">${E(f.answer.slice(0, 80))}...</td>` })),
      ['السؤال', 'الجواب'], 'faq') +
    `<div class="glass" style="margin-bottom:18px"><h3>⭐ آراء الطلاب</h3>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:12px">⚠️ أضف فقط شهادات حقيقية من طلاب فعليين — لا تختلق مراجعات أو أرقاماً.</p>
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary btn-sm" id="add-testi">+ إضافة شهادة</button></div>
      <div class="table-wrap"><table class="admin-table"><tr><th>الاسم</th><th>الشهادة</th><th>إجراءات</th></tr>
      ${testis.map((t) => `<tr><td>${E(t.name)}</td><td style="color:var(--muted)">${E(t.text.slice(0, 90))}...</td>
        <td><div class="row-actions"><button class="icon-btn" data-del-testi="${t.id}" style="color:#ff9a9a">🗑️</button></div></td></tr>`).join('')
        || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">لا توجد شهادات بعد</td></tr>'}
      </table></div></div>` +
    block('🏷️ أكواد الخصم', 'add-coupon',
      coupons.map((c) => ({ id: c.id, visible: c.is_active, cells: `<td dir="ltr" style="text-align:left"><b>${E(c.code)}</b></td><td>${c.percent_off}%</td>` })),
      ['الكود', 'الخصم'], 'coupon');

  document.getElementById('add-bonus').onclick = () => openModal('إضافة بونص', [
    { label: 'العنوان', value: '' }, { label: 'الوصف', type: 'textarea', value: '' },
  ], async ([title, description]) => { await Store.adminCreate('bonuses', { title, description, sort_order: bonuses.length, is_visible: 1 }); App.toast('✓'); renderSite(); });

  document.getElementById('add-faq').onclick = () => openModal('إضافة سؤال شائع', [
    { label: 'السؤال', value: '' }, { label: 'الجواب', type: 'textarea', value: '' },
  ], async ([question, answer]) => { await Store.adminCreate('faqs', { question, answer, sort_order: faqs.length, is_visible: 1 }); App.toast('✓'); renderSite(); });

  document.getElementById('add-testi').onclick = () => openModal('إضافة شهادة حقيقية', [
    { label: 'اسم الطالب', value: '' }, { label: 'صفته (اختياري)', value: '' }, { label: 'نص الشهادة', type: 'textarea', value: '' },
  ], async ([name, role, text]) => { await Store.adminCreate('testimonials', { name, role, text, sort_order: testis.length, is_visible: 1 }); App.toast('✓'); renderSite(); });

  document.getElementById('add-coupon').onclick = () => openModal('إضافة كود خصم', [
    { label: 'الكود', value: '', dir: 'ltr' }, { label: 'نسبة الخصم %', type: 'number', value: 10 },
  ], async ([code, percent_off]) => { await Store.adminCreate('coupons', { code: code.toUpperCase(), percent_off, is_active: 1 }); App.toast('✓'); renderSite(); });

  panel.onclick = async (e) => {
    const b = e.target.closest('[data-del-bonus],[data-vis-bonus],[data-del-faq],[data-vis-faq],[data-del-coupon],[data-vis-coupon],[data-del-testi]');
    if (!b) return;
    const d = b.dataset;
    const table = d.delBonus !== undefined || d.visBonus !== undefined ? 'bonuses'
      : d.delFaq !== undefined || d.visFaq !== undefined ? 'faqs'
      : d.delCoupon !== undefined || d.visCoupon !== undefined ? 'coupons' : 'testimonials';
    const id = +(d.delBonus || d.visBonus || d.delFaq || d.visFaq || d.delCoupon || d.visCoupon || d.delTesti);
    if (d.delBonus !== undefined || d.delFaq !== undefined || d.delCoupon !== undefined || d.delTesti !== undefined) {
      if (confirm('حذف هذا العنصر؟')) { await Store.adminDelete(table, id); renderSite(); }
    } else {
      const all = { bonuses, faqs, coupons }[table];
      const item = all.find((x) => x.id === id);
      const field = table === 'coupons' ? 'is_active' : 'is_visible';
      await Store.adminUpdate(table, id, { [field]: item[field] ? 0 : 1 });
      renderSite();
    }
  };
}

// ---------- students ----------
async function renderStudents() {
  const list = await Store.adminUsers();
  const panel = document.getElementById('panel-students');
  panel.innerHTML = `
    <div class="glass"><h3 style="margin-bottom:14px">👥 الطلاب والمستخدمون (${list.length})</h3>
    <div class="table-wrap"><table class="admin-table">
      <tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الاشتراك</th><th>إجراءات</th></tr>
      ${list.map((u) => `<tr><td>${E(u.name)}</td><td dir="ltr" style="text-align:left">${E(u.email)}</td>
        <td>${u.role === 'admin' ? '<span class="pill on">Admin</span>' : 'طالب'}</td>
        <td>${u.enrolled ? '<span class="pill on">مشترك ✓</span>' : '<span class="pill off">غير مشترك</span>'}</td>
        <td><div class="row-actions">
          <button class="icon-btn" data-enroll="${u.id}" data-on="${u.enrolled ? 0 : 1}">${u.enrolled ? 'إلغاء الاشتراك' : 'تفعيل الاشتراك'}</button>
          <button class="icon-btn" data-role="${u.id}" data-r="${u.role === 'admin' ? 'student' : 'admin'}">${u.role === 'admin' ? '⬇ طالب' : '⬆ Admin'}</button>
        </div></td></tr>`).join('')}
    </table></div>
    <p style="color:var(--muted);font-size:.88rem;margin-top:12px">💡 "تفعيل الاشتراك" يمنح الطالب الوصول الفوري للدورة — استعمله بعد تأكيد الدفع اليدوي.</p></div>`;
  panel.querySelectorAll('[data-enroll]').forEach((btn) => btn.onclick = async () => {
    await Store.adminEnroll(+btn.dataset.enroll, btn.dataset.on === '1');
    App.toast('تم ✓'); renderStudents();
  });
  panel.querySelectorAll('[data-role]').forEach((btn) => btn.onclick = async () => {
    if (confirm('تغيير دور هذا المستخدم؟')) { await Store.adminRole(+btn.dataset.role, btn.dataset.r); renderStudents(); }
  });
}

// ---------- settings ----------
const SETTING_GROUPS = [
  { title: '🏷️ الدورة', keys: [
    ['COURSE_NAME', 'اسم الدورة'], ['COURSE_DESCRIPTION', 'وصف الدورة', 'textarea'],
    ['LOGO_URL', 'رابط الشعار (LOGO_URL)', null, 'ltr'], ['VIDEO_PROVIDER', 'مزود الفيديو الافتراضي', 'select', null, [['youtube', 'YouTube'], ['vimeo', 'Vimeo'], ['cloudflare', 'Cloudflare Stream'], ['mp4', 'MP4 مباشر']]],
  ]},
  { title: '💰 الأسعار والدفع', keys: [
    ['COURSE_PRICE', 'السعر الحالي (COURSE_PRICE)'], ['ORIGINAL_PRICE', 'السعر قبل الخصم (ORIGINAL_PRICE)'],
    ['CURRENCY', 'العملة'], ['PAYMENT_URL', 'رابط الدفع (PAYMENT_URL)', null, 'ltr'],
  ]},
  { title: '👨‍🏫 المدرب', keys: [
    ['INSTRUCTOR_NAME', 'اسم المدرب'], ['INSTRUCTOR_BIO', 'نبذة عن المدرب', 'textarea'],
    ['INSTRUCTOR_IMAGE', 'رابط صورة المدرب (INSTRUCTOR_IMAGE)', null, 'ltr'],
    ['INSTRUCTOR_EXPERIENCE', 'الخبرة', 'textarea'], ['INSTRUCTOR_STYLE', 'أسلوب التعليم', 'textarea'],
  ]},
  { title: '✍️ نصوص صفحة البيع', keys: [
    ['HERO_TITLE', 'العنوان الرئيسي'], ['HERO_SUBTITLE', 'العنوان الفرعي', 'textarea'],
    ['CTA_TEXT', 'نص زر الشراء'], ['TRUST_LINE', 'عبارة الثقة'],
    ['DISCLAIMER', 'إخلاء المسؤولية', 'textarea'],
  ]},
  { title: '🔍 SEO', keys: [
    ['SEO_TITLE', 'عنوان SEO'], ['META_DESCRIPTION', 'وصف Meta', 'textarea'],
  ]},
];
async function renderSettings() {
  const s = await Store.settings();
  const panel = document.getElementById('panel-settings');
  panel.innerHTML = SETTING_GROUPS.map((g, gi) => `
    <div class="glass" style="margin-bottom:18px"><h3 style="margin-bottom:14px">${g.title}</h3>
    <div class="settings-grid">
    ${g.keys.map(([key, label, type, dir, options]) => {
      const v = s[key] ?? '';
      let input;
      if (type === 'textarea') input = `<textarea id="set-${key}" rows="3">${E(v)}</textarea>`;
      else if (type === 'select') input = `<select id="set-${key}">${options.map((o) => `<option value="${o[0]}" ${v === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
      else input = `<input id="set-${key}" value="${E(v)}" ${dir ? `dir="${dir}" style="text-align:left"` : ''}>`;
      return `<div class="field"><label><code dir="ltr" style="color:var(--green)">${key}</code> — ${label}</label>${input}</div>`;
    }).join('')}
    </div></div>`).join('') +
    `<button class="btn btn-primary btn-lg btn-block" id="save-settings">💾 حفظ كل الإعدادات</button>`;
  document.getElementById('save-settings').onclick = async () => {
    const obj = {};
    SETTING_GROUPS.forEach((g) => g.keys.forEach(([key]) => { obj[key] = document.getElementById('set-' + key).value; }));
    await Store.adminSaveSettings(obj);
    App.toast('تم حفظ الإعدادات ✓');
  };
}

(async function () {
  await App.renderHeader();
  let user;
  try { user = await Store.me(); } catch {}
  if (!user || user.role !== 'admin') { location.href = '/login?next=/admin'; return; }
  await App.applySettings();
  renderOverview();
})();
